  }
  setInterval(readStatus, 1000); readStatus();

  // ── LE PERSONNAGE (mode libre) ─────────────────────────────────────────────
  // En mode libre le canvas ne dessine plus rien : on ne LANCE PAS render(),
  // plutôt que de le laisser tourner sous un canvas caché. Une boucle qui
  // peint pour personne, sur une fenêtre transparente toujours au-dessus,
  // fait recomposer WindowServer à chaque image — c'est exactement le coût
  // que la V22 avait supprimé.
  /* ── LA VAGUE DU DOCK, ET S'ASSEOIR ───────────────────────────────────────
     Le processus principal envoie la HAUTEUR dont le Dock est gonflé sous le
     compagnon ; on l'amortit ici, image par image. Faire ça côté fenêtre
     (setBounds à 60 Hz) donnait un mouvement par crans : la position d'une
     fenêtre est un entier de points, et chaque déplacement fait recomposer
     tout ce qui est dessous. Ici on ne bouge qu'une couche déjà rendue.

     ⚠ Ce bloc a d'abord atterri DANS LE <style>, avant l'ouverture du script :
     du texte mort, jamais exécuté. Rien ne le signalait — pas d'erreur, juste
     un compagnon qui ne surfait pas. Une ancre de remplacement qui existe en
     double (ici un commentaire présent en CSS ET en JS) tape sur la première
     occurrence, et ce n'est pas forcément la bonne. */
  const ASSIS = 0;   // plus de pose assise : il ne fait que marcher                // doit valoir SOLO_ASSIS de main.js
  let assisCible = 0, assisVu = 0;
  let vagueCible = 0, vagueVue = 0, vagueRAF = null;
  const ecran = document.getElementById('screen');
  const dit   = document.getElementById('dit');

  /* ── LE BOND : deux places ────────────────────────────────────────────────
     Assis sur le bout du Dock au repos ; debout dans le coin bas droit dès
     qu'un agent travaille. La course vient du processus principal, qui seul
     connaît la géométrie du Dock — on ne la recalcule pas ici. */
  let BOND_DX = 0, BOND_DY = 0;
  /* ── UN VRAI SAUT, PAS UN GLISSEMENT ──────────────────────────────────────
     Première version : une seule interpolation adoucie aux deux bouts, arc de
     34 pt. Résultat — il GLISSAIT d'une place à l'autre. Deux raisons, et il
     fallait corriger les deux :
      · l'horizontale était ralentie au départ ET à l'arrivée. Un corps en l'air
        n'est plus poussé : sa vitesse horizontale est CONSTANTE. C'est ce
        détail qui fait lire « saut » plutôt que « déplacement » ;
      · il n'y avait ni élan ni réception, donc aucun poids.
     Maintenant quatre temps nets, que l'œil peut suivre. */
  /* Cinq temps. Les deux premiers manquaient : il fléchissait en position
     ASSISE, ce qui ne peut pas se lire — on ne plie pas des genoux déjà pliés.
     Il se RELÈVE d'abord, puis il fléchit, puis il part. */
  const BOND_LEVER   = 180;        // il quitte l'assise et se met debout
  const BOND_FLEX    = 130;        // il fléchit les genoux — l'élan
  const BOND_VOL     = 420;        // en l'air : horizontale LINÉAIRE, verticale parabolique
  const BOND_IMPACT  = 240;        // réception : il encaisse, genoux fléchis
  const BOND_REPRISE = 160;        // il se redresse
  const BOND_ANTI    = BOND_LEVER + BOND_FLEX;          // tout ce qui précède le décollage
  const BOND_TOTAL   = BOND_ANTI + BOND_VOL + BOND_IMPACT + BOND_REPRISE;
  /* ── POURQUOI ÇA ACCROCHAIT ────────────────────────────────────────────────
     Verrouiller l'échelle pendant le vol supprimait bien la re-rastérisation…
     mais créait DEUX RUPTURES : au décollage elle sautait de 0,80 à 1,07 en
     une image, à la réception de 1,07 à 0,78. Deux à-coups, exactement aux
     deux instants qu'on regarde. Un mouvement n'est pas fluide parce qu'il
     coûte peu : il est fluide parce qu'il est CONTINU.
     Maintenant l'écrasement est une seule courbe continue d'un bout à l'autre,
     et la largeur en découle par CONSERVATION DU VOLUME (sx = 1/√sy) — c'est
     ce qui donne l'élasticité de l'animation d'origine, où rien ne gonfle
     jamais sans se rétrécir ailleurs. */
  const volume = (sy) => 1 / Math.sqrt(sy);
  const BOND_FLEX_SY = 0.82;       // accroupi, fin d'élan
  const BOND_IMP_SY  = 0.84;       // écrasement maximal à la réception
  // Sommet de la trajectoire. Il doit passer NETTEMENT au-dessus du point de
  // départ, sinon la parabole se confond avec la descente vers le sol : la
  // place debout est déjà ~49 pt plus bas que l'assise.
  // 96 → 74 : à 96 pt pour 104 pt de course il flottait, la trajectoire tirait
  // à la verticale. Un saut se lit à sa forme, pas à sa hauteur.
  const BOND_APEX = 64;
  let bondCible = 0, bondVu = 0, bondDe = 0, bondT0 = 0, bondActif = false;
  let bondArc = 0, bondSx = 1, bondSy = 1;

  function lancerBond(vers){
    bondDe = bondVu; bondCible = vers;
    bondT0 = performance.now(); bondActif = true;
    /* un saut relancé avant la fin du précédent repart les pieds au sol :
       sinon l'ombre resterait effacée pour toujours. */
    document.body.dataset.vol = '0';
  }

  /* Écrase / étire autour des PIEDS : un corps se comprime vers le sol, pas
     vers son centre. 43 pt = milieu du corps, 110 pt = la plante. */
  ecran.style.transformOrigin = '43px 110px';

  // Rend la progression spatiale 0→1 et pose l'écrasement de l'image.
  function phaseBond(e){
    if (e < BOND_LEVER) {                                 // 1. IL SE RELÈVE
      // rien à écraser : c'est `assisVu` qui le remet debout, tout seul.
      bondSy = 1; bondArc = 0;
      bondSx = volume(bondSy); return 0;
    }
    if (e < BOND_ANTI) {                                  // 2. IL FLÉCHIT
      const k = (e - BOND_LEVER) / BOND_FLEX;
      bondSy = 1 - (1 - BOND_FLEX_SY) * (k * k);          // il se ramasse en accélérant
      bondSx = volume(bondSy); bondArc = 0; return 0;
    }
    if (e < BOND_ANTI + BOND_VOL) {                       // 3. VOL
      const f = (e - BOND_ANTI) / BOND_VOL;
      /* Une seule courbe, qui PART exactement de l'accroupi (continuité au
         décollage), s'étire, redevient neutre au sommet, puis se réétire à la
         chute. |2f−1| vaut 1 aux deux bouts et 0 au sommet. */
      const detente = Math.min(1, f / 0.28);              // extension des jambes
      bondSy = BOND_FLEX_SY + (0.18 + 0.12 * Math.abs(2 * f - 1)) * detente;
      bondSx = volume(bondSy);
      bondArc = BOND_APEX * 4 * f * (1 - f);              // parabole
      if (document.body.dataset.vol !== '1') document.body.dataset.vol = '1';
      return f;                                           // ⚠ LINÉAIRE : c'est ça, le saut
    }
    document.body.dataset.vol = '0';                      // il a retrouvé le sol
    if (e < BOND_ANTI + BOND_VOL + BOND_IMPACT) {         // 4. IL ENCAISSE
      const k = (e - BOND_ANTI - BOND_VOL) / BOND_IMPACT;
      /* il ARRIVE étiré (1,12) : on repart de là, on écrase, puis on remonte.
         Repartir de l'écrasement maximal aurait fait le second à-coup. */
      const ARRIVEE = BOND_FLEX_SY + 0.30;
      bondSy = k < 0.60 ? ARRIVEE - (ARRIVEE - BOND_IMP_SY) * (k / 0.60)
                        : BOND_IMP_SY + (1 - BOND_IMP_SY) * ((k - 0.60) / 0.40);
      bondSx = volume(bondSy); bondArc = 0; return 1;
    }
    const k = Math.min(1, (e - BOND_ANTI - BOND_VOL - BOND_IMPACT) / BOND_REPRISE);
    bondSy = 1 + 0.045 * Math.sin(Math.PI * k) * (1 - k);  // dernier rebond, amorti
    bondSx = volume(bondSy); bondArc = 0;
    return 1;                                             // 5. il se redresse
  }
  ipcRenderer.on('cap-bond', (_e, b) => {
    BOND_DX = b.dx; BOND_DY = b.dy;
    /* la fenêtre descend jusqu'au sol : le dessin doit rester calé sur la
       place ASSISE, donc on repousse son bas de toute la descente du bond. */
    ecran.style.bottom = (ASSIS + b.dy) + 'px';
  });

  ipcRenderer.on('cap-vague', (_e, h) => {
    vagueCible = h;
    if (!vagueRAF) vagueRAF = requestAnimationFrame(suivreVague);
  });
  function suivreVague(){
    const ecart = vagueCible - vagueVue;
    // ~5 images pour rattraper : il surfe, il ne colle pas au curseur.
    vagueVue += ecart * 0.22;
    if (Math.abs(ecart) < 0.15) vagueVue = vagueCible;
    // s'asseoir / se relever : plus lent que la vague, c'est un GESTE et pas
    // un réflexe. Même boucle : deux amortissements séparés se désynchronisent
    // et le personnage part en diagonale.
    const e2 = assisCible - assisVu;
    assisVu += e2 * 0.09;
    if (Math.abs(e2) < 0.15) assisVu = assisCible;

    /* Le BOND est un geste MINUTÉ, pas un amortissement : un saut a une durée
       propre. L'amortissement exponentiel du reste ne convient pas — il
       n'arrive jamais vraiment, et un personnage qui « fond » d'une place à
       l'autre ne saute pas, il glisse. */
    if (bondActif) {
      const e = performance.now() - bondT0;
      bondVu = bondDe + (bondCible - bondDe) * phaseBond(e);
      if (e >= BOND_TOTAL) { bondActif = false; bondVu = bondCible;
                             bondArc = 0; bondSx = bondSy = 1; }
    }
    const bx = BOND_DX * bondVu;
    // la parabole SOUSTRAIT : elle le fait monter au-dessus de la ligne qui
    // relie ses deux places, elle ne l'accompagne pas à plat.
    const by = BOND_DY * bondVu - bondArc;

    const ty = assisVu - vagueVue + by;
    ecran.style.transform = 'translate3d(' + bx.toFixed(2) + 'px,' + ty.toFixed(2) + 'px,0)'
                          + ' scale(' + bondSx.toFixed(3) + ',' + bondSy.toFixed(3) + ')';
    // la pastille suit le compagnon : elle le DÉSIGNE, elle ne flotte pas.
    dit.style.transform = 'translate(calc(-50% + ' + bx.toFixed(2) + 'px),' + ty.toFixed(2) + 'px)';
    vagueRAF = (vagueVue === vagueCible && assisVu === assisCible && !bondActif)
                 ? null : requestAnimationFrame(suivreVague);
  }

  /* ── LA PASTILLE : quand la montrer ───────────────────────────────────────
     · au CHANGEMENT d'activité, quelques secondes — c'est là qu'on la lit ;
     · au SURVOL, tant que le curseur est dessus.
     Le survol l'emporte : si on la regarde, elle ne s'efface pas sous le nez. */
  let ditMinuteur = null, ditSurvol = false, vu = true;
  function montrerDit(texte, duree){
    if (!texte) return;
    dit.textContent = texte;
    dit.classList.add('vu');
    clearTimeout(ditMinuteur);
    if (duree) ditMinuteur = setTimeout(() => { if (!ditSurvol) dit.classList.remove('vu'); }, duree);
  }
  function nomAgent(a){ return (ROLE[a] && ROLE[a][0]) || String(a).toUpperCase(); }

  if(SOLO){
    // lottie.min.js et le moteur de teinte ne se chargent qu'ici : inutiles
    // en mode boîte, où la créature pixel reste au canvas.
    charger(['lottie/lottie.min.js','lottie/teinte.js'], () => {
      fetch('lottie/palette.json').then(r=>r.json()).then(palette=>{
        const [hMarche, hRepos] = document.querySelectorAll('#avatar>div');

        /* Deux animations superposées, une par allure. On FOND de l'une à
           l'autre : le personnage n'est jamais absent, pas même une image.
           Chacune est un fichier normal de 58 images — voir states.py pour
           pourquoi une seconde plage dans le même fichier ne marche pas. */
        const anims = {};
        function monter(nom, hote, fichier, pret){
          const a = lottie.loadAnimation({container:hote, renderer:'svg',
            loop:true, autoplay:false, path:'lottie/' + fichier});
          a.setSubframe(false);
          a.addEventListener('DOMLoaded', ()=>{ anims[nom] = {a, hote,
            teinte: new Teinte(hote.querySelector('svg'), palette)}; pret(); });
        }

        // ⚠ UNE SEULE ANIMATION. Décision de l'utilisateur, 2026-07-31 : « on ne garde
        // que la marche ». La pose de repos, le bond, le pont de transition et
        // la bascule de sens sont retirés — il marche sur place, tourné vers la
        // gauche, et c'est tout. Ce qui reste pour dire l'état : la CADENCE
        // (il marche / il est figé) et la TEINTE (quel agent).
        let restants = 1;
        const demarrer = ()=>{ if (--restants) return;
          let allure = null, dernier = null;

          /* Le PONT. Le corps se ramasse, on échange les deux rigs au moment
             où il est le plus compact, puis il se détend. Rien ne fond : à
             aucune image il n'y a deux corps.
             190 ms = 38 % de 500 ms, c'est-à-dire le pic de compression de
             `@keyframes bascule`. Les deux valeurs vont ENSEMBLE : bouger
             l'une sans l'autre fait réapparaître l'échange en pleine vue. */
          const PONT_MS = 500, ECHANGE_MS = 190;
          let pontT = null, pontFinT = null;

          /* `jouer` : on montre la pose DEBOUT sans lancer la marche. Pendant
             un saut il ne doit pas pédaler en l'air — il tient une pose. */
          function echanger(nom, jouer = true){
            for (const [k, v] of Object.entries(anims)) {
              const actif = (k === nom);
              v.hote.classList.toggle('vu', actif);
              /* Le REPOS reste figé sur une image : la respiration se fait en
                 CSS. Mesuré : jouer cette image quasi immobile 24 fois par
                 seconde coûtait 17 % de processeur ; figée + CSS, 2,8 %. */
              if (actif && nom === 'marche' && !REDUCE && jouer) v.a.play();
              else { v.a.pause(); if (actif) v.a.goToAndStop(REDUCE ? 26 : 0, true); }
            }
            souffler(nom === 'repos');
            /* S'ASSEOIR PART AVEC L'ÉCHANGE, pas avant. Auparavant l'écran
               remontait pendant le fondu : une troisième interpolation lancée
               en même temps que les deux autres. Un geste, un instant. */
            assisCible = (nom === 'repos') ? ASSIS : 0;
            if (!vagueRAF) vagueRAF = requestAnimationFrame(suivreVague);
          }

          function allerAllure(nom){
            if (nom === allure) return;
            const premier = (allure === null);
            allure = nom;
            document.body.dataset.allure = nom;
            /* Au tout premier montage il n'y a rien à quitter, et en mouvement
               réduit on coupe net : dans les deux cas, pas de pont. */
            if (premier || REDUCE) { echanger(nom); return; }

            /* ── QUAND IL Y A UN SAUT, LE SAUT EST LA TRANSITION ────────────
               Sinon deux écrasements se superposent — celui du pont et celui
               de l'élan — et on ne lit plus ni l'un ni l'autre. Le pont ne
               sert que lorsqu'il change d'allure SANS changer de place. */
            const vers = (nom === 'repos') ? 0 : 1;
            if (BOND_DX > 1) {
              clearTimeout(pontT); clearTimeout(pontFinT);
              document.getElementById('avatar').classList.remove('bascule');
              /* ⚠ IL SE MET DEBOUT AVANT DE SAUTER, dans les deux sens.
                 On ne fléchit pas des genoux déjà pliés : tant qu'il portait
                 la pose ASSISE pendant l'élan, la détente ne pouvait pas se
                 lire. Il prend donc la pose debout dès le premier temps —
                 mais FIGÉE (`jouer:false`), sinon il pédale en l'air. */
              echanger('marche', false);
              /* ⚠ IL REGARDE OÙ IL VA. À l'aller il part vers la droite, donc
                 rien à faire. Au RETOUR il saute vers le Dock, qui est à sa
                 gauche : il se retourne AVANT de s'élancer — sauter à reculons
                 ne se lit pas. */
              lancerBond(vers);
              /* Et il ne reprend son allure qu'à la RÉCEPTION : la marche s'il
                 va travailler, l'assise s'il rentre se poser sur le Dock. */
              pontT = setTimeout(() => {
                echanger(nom);
                /* Posé sur le Dock, il se retourne vers le coin — c'est là
                   qu'il regarde quand il ne travaille pas. */
              }, BOND_ANTI + BOND_VOL);
              if (!vagueRAF) vagueRAF = requestAnimationFrame(suivreVague);
              return;
            }

            const av = document.getElementById('avatar');
            /* relancer une animation CSS déjà posée demande de la retirer, de
               forcer un recalcul, puis de la remettre — sans le reflow, une
               bascule qui suit de près la précédente ne rejoue pas. */
            av.classList.remove('bascule'); void av.offsetWidth; av.classList.add('bascule');
            clearTimeout(pontT); clearTimeout(pontFinT);
            pontT    = setTimeout(() => echanger(nom), ECHANGE_MS);
            pontFinT = setTimeout(() => av.classList.remove('bascule'), PONT_MS + 30);
          }

          /* Le souffle : 2,4 s toutes les 20 s, et rien entre les deux. Une
             animation CSS permanente ferait recomposer l'écran à chaque
             image, même quand le mouvement est imperceptible. */
          let horlogeSouffle = null;
          function souffler(actif){
            clearInterval(horlogeSouffle); horlogeSouffle = null;
            const svg = () => anims.repos && anims.repos.hote.querySelector('svg');
            if (svg()) svg().classList.remove('souffle');
            if (!actif || REDUCE) return;
            const un = () => { const e = svg(); if (!e) return;
              e.classList.add('souffle');
              setTimeout(()=>e.classList.remove('souffle'), 2500); };
            setTimeout(un, 900);
            horlogeSouffle = setInterval(un, 20000);
          }

          function peindre(etat, ms){
            for (const v of Object.values(anims)) v.teinte.etat(etat, ms);
          }

          (function suivre(){
           try{
            const a = cur.state==='busy' ? (cur.activity||'working') : 'idle';
            allerAllure('marche');
            /* IL MARCHE QUAND QUELQUE CHOSE TRAVAILLE, ET SEULEMENT ALORS.
               La flânerie au repos a été retirée : elle donnait un compagnon
               qui marchait en permanence, donc qui ne disait plus rien — et
               au ralenti, ce qui se lisait comme une panne. Marcher est le
               signal ; il doit coûter quelque chose pour valoir quelque chose.
               ⚠ Encore faut-il que l'état soit RAFRAÎCHI : voir le battement
               dans hooks/track_read.py, sans lequel il se figeait en plein
               travail au bout de 30 s. */
            const m = anims.marche;
            if (m) { if (a === 'idle' || REDUCE) m.a.pause(); else m.a.play(); }
            /* Plus personne ne travaille → l'étiquette s'en va. C'est le seul
               endroit qui l'efface, maintenant qu'elle n'a plus de minuteur. */
            if (a === 'idle' && !ditSurvol) {
              clearTimeout(ditMinuteur); dit.classList.remove('vu');
            }
            if(a!==dernier){
              const premier = dernier === null;
              dernier = a;
              /* L'étiquette entre APRÈS le geste, pas avec lui : sortie à
                 l'instant zéro elle couvrait le raccord et volait la lecture
                 du mouvement. 280 ms = juste après l'échange, quand la
                 silhouette est de nouveau stable et lisible.
                 ⚠ DURÉE 0 = elle RESTE. Elle dit quel agent travaille en ce
                 moment : elle doit tenir tout le temps du travail, pas
                 s'effacer au bout d'une seconde et laisser l'utilisateur
                 devant un personnage coloré qu'il ne peut plus nommer.
                 C'est le passage à `idle` qui la retire. */
              /* ⚠ JAMAIS de pastille pour `idle`. Vu sur la planche du cycle :
                 en repartant s'asseoir il annonçait « LES 8 AGENTS » — le
                 libellé du repos. Une pastille nomme QUI TRAVAILLE ; quand
                 personne ne travaille, il n'y a rien à nommer. */
              if(!premier && a !== 'idle') setTimeout(() => montrerDit(nomAgent(a), 0), 280);
              peindre(palette.etats[a]!=null ? a : 'working',
                      premier ? 0 : 900);
            }
           }catch(e){
             /* Lottie AVALE les exceptions de ses propres écouteurs : sans ce
                filet, une erreur ici ne laisse aucune trace et on ne voit
                qu'un personnage qui ne se peint jamais. */
             try{ require('fs').appendFileSync('/tmp/capsule-avatar.log',
               new Date().toISOString()+' suivre() : '+(e&&e.stack||e)+'\n'); }catch(_){}
           }
            setTimeout(suivre, 400);
          })();
        };

        monter('marche', hMarche, 'avatar.json', demarrer);

        /* L'animation s'arrête quand personne ne la voit : fenêtre cachée,
           écran éteint, ou mouvement réduit demandé. */
        const majLecture = ()=>{ for (const v of Object.values(anims))
          if (!vu || document.hidden || REDUCE) v.a.pause(); };
        ipcRenderer.on('cap-visible', (_e, v)=>{ vu = v; majLecture(); });
        document.addEventListener('visibilitychange', majLecture);
      }).catch(journal);
    }, journal);
  } else {
    render();
  }

  /* Charge des scripts à la suite. L'échec ne doit JAMAIS être muet : sans
     journal, il ne reste qu'un compagnon absent et on cherche le défaut dans
     l'animation alors que le script n'est jamais arrivé. */
  function charger(srcs, fini, rate){
    const suivant = () => {
      if(!srcs.length) return fini();
      const s=document.createElement('script');
      s.src=srcs.shift(); s.onload=suivant; s.onerror=()=>rate(new Error(s.src));
      document.head.appendChild(s);
    };
    suivant();
  }
  function journal(e){
    try{ require('fs').appendFileSync('/tmp/capsule-avatar.log',
      new Date().toISOString()+' '+(e&&e.message||e)+'\n'); }catch(_){}
    document.body.dataset.solo='0'; render();      // repli : la créature pixel
  }
</script>
</body>
</html>
