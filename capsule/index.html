<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<style>
  :root { --cyan:#5ad7e6; --green:#61e6a0; --red:#e0685e; --amber:#f2c94c; --claude:#c77b5a;
          --violet:#b78be6; --steel:#7aa6e0; --gold:#e0a85e; }
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
  html,body { background:transparent; overflow:hidden; font-family:"Courier New",monospace; }

  #capsule {
    width:188px; height:304px; padding:9px;
    display:flex; flex-direction:column; align-items:center; border-radius:18px;
    /* V22 — AT REST: NO backdrop-filter. Blurring the background of a transparent
       alwaysOnTop window forces the GPU to re-blur what is BEHIND, continuously, at the
       compositor's pace — entirely independent of the canvas fps cap. That was the residual
       helper GPU (~5 % d'un cœur en permanence). Au repos on sert un fond translucide simple :
       cost at rest. A flat tint is visually near-identical and almost free. Real glass comes back when busy, when you are watching. */
    background:rgba(26,23,21,0.86);
    border:1px solid rgba(255,255,255,0.16);
    box-shadow:0 8px 30px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,0.12);
    -webkit-app-region:drag; position:relative; transition:box-shadow .3s, border-color .3s, background .3s;
  }
  body[data-state="busy"] #capsule {
    border-color:var(--led,var(--claude))aa; animation:halo 2.8s ease-in-out infinite;
    background:rgba(26,23,21,0.55);
    -webkit-backdrop-filter:blur(12px) saturate(1.1); backdrop-filter:blur(12px) saturate(1.1);  /* V22 : 18→12 px */
  }

  #btns { position:absolute; top:6px; right:7px; display:flex; gap:4px; opacity:0; transition:opacity .15s; -webkit-app-region:no-drag; z-index:6; }
  #capsule:hover #btns { opacity:1; }
  .btn { width:13px; height:13px; font-size:10px; line-height:12px; text-align:center; cursor:pointer; color:#1a1410; font-weight:bold; border-radius:2px; }
  #reduce { background:var(--amber); } #reduce:hover{ background:#ffe07a; }
  #del { background:var(--red); color:#fff; } #del:hover{ background:#ff8478; }

  #dot { position:absolute; top:8px; left:9px; width:6px; height:6px; background:#3a302a; border-radius:1px; }
  body[data-state="busy"] #dot { background:var(--led,var(--claude)); animation:ledpulse 1.5s ease-in-out infinite; }

  #screen { position:relative; width:160px; height:150px; margin-top:8px;
    background:rgba(18,16,15,0.45); border:3px solid rgba(12,11,10,0.7); border-radius:9px; overflow:hidden;
    box-shadow:inset 0 0 0 2px #2a2622; }
  #scr { position:absolute; inset:0; width:100%; height:100%; image-rendering:pixelated; }
  #crt { position:absolute; inset:0; pointer-events:none;
    background:
      radial-gradient(circle at 50% 44%, transparent 62%, rgba(0,0,0,.30)),
      repeating-linear-gradient(0deg, rgba(0,0,0,.08) 0 1px, transparent 1px 3px);
    mix-blend-mode:multiply; opacity:.42; }

  /* ── LABEL: the current activity (verb) ─────────────────────── */
  #label { margin-top:8px; color:var(--led,var(--claude)); font-size:15px; font-weight:bold;
    letter-spacing:2px; text-transform:uppercase; height:18px; width:100%; text-align:center;
    text-shadow:0 0 10px var(--led,var(--claude)); }
  body[data-state="idle"] #label { color:#c99b7e; text-shadow:0 0 6px rgba(201,155,126,.35); } /* idle label: readable and warm (echoes the mascot) */

  /* ── DETAIL: a terminal-style "live" line (pulsing dot + text) ── */
  #detail { margin-top:4px; height:12px; width:152px; display:flex; align-items:center;
    justify-content:center; gap:5px; opacity:0; transition:opacity .35s; }
  body[data-state="busy"] #detail { opacity:1; }
  body[data-state="idle"][data-last="1"] #detail { opacity:.5; }   /* idle : rappel « dernier agent · il y a X » */
  #detail .dot { width:4px; height:4px; border-radius:50%; flex:0 0 auto;
    background:var(--led,var(--claude)); box-shadow:0 0 5px var(--led,var(--claude));
    animation:ledpulse 1.3s ease-in-out infinite; }
  body[data-state="idle"] #detail .dot { animation:none; box-shadow:none; opacity:.7; }  /* statique en idle */
  #detail .txt { color:#cbbdac; opacity:.85; font-size:7.5px; letter-spacing:.5px;
    text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:132px; }

  /* ── PROGRESS : pipeline DISTILL → ORGANIZE → SAVE, segments en relief ── */
  #progress { position:relative; margin-top:11px; width:154px; height:6px; display:flex; gap:5px; opacity:0; transition:opacity .35s; }
  body[data-state="busy"] #progress { opacity:1; }
  .seg { flex:1; height:100%; border-radius:99px; position:relative; overflow:hidden;
    background:rgba(0,0,0,0.30); transition:opacity .3s;
    box-shadow:inset 0 1px 1.5px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(255,255,255,0.05); }

  /* INDETERMINATE mode: agents with no 3-phase pipeline (challenger, archivist, synthesizer, architect, mechanic)
     → hide the segments/labels and show a sliding-pulse activity bar (honest: no fake phase). */
  #indet { position:absolute; inset:0; display:none; border-radius:99px; overflow:hidden;
    background:rgba(0,0,0,0.30); box-shadow:inset 0 1px 1.5px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(255,255,255,0.05); }
  #indet span { position:absolute; top:0; bottom:0; left:-42%; width:42%; border-radius:99px;
    background:linear-gradient(90deg, transparent 0%, var(--led,var(--claude)) 50%, transparent 100%);
    box-shadow:0 0 8px var(--led,var(--claude)); animation:indet 1.4s ease-in-out infinite; }
  body[data-prog="indet"] .seg { opacity:0; }
  body[data-prog="indet"] #indet { display:block; }
  body[data-prog="indet"] #steplabels span { visibility:hidden; }  /* keeps the height → no layout jump */
  .seg .fill { position:absolute; inset:0; width:0%; border-radius:99px;
    background:linear-gradient(180deg,
      color-mix(in srgb, var(--led,var(--claude)) 68%, #fff) 0%,
      var(--led,var(--claude)) 50%,
      color-mix(in srgb, var(--led,var(--claude)) 82%, #000) 100%);
    transition:width .5s cubic-bezier(.4,0,.2,1); }
  .seg.done .fill   { width:100%; box-shadow:0 0 7px var(--led,var(--claude)), inset 0 1px 0 rgba(255,255,255,0.4); }
  .seg.active .fill { width:100%; box-shadow:0 0 9px var(--led,var(--claude)), inset 0 1px 0 rgba(255,255,255,0.45); }
  .seg.active .fill::after { content:''; position:absolute; inset:0; border-radius:99px;
    background:linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.55) 50%, transparent 100%);
    background-size:230% 100%; animation:slide 1.25s linear infinite; }

  /* ── STEP LABELS: aligned under each segment, states past/on/pending ── */
  #steplabels { width:154px; margin-top:6px; display:flex; gap:5px; opacity:0; transition:opacity .35s; }
  body[data-state="busy"] #steplabels { opacity:1; }
  #steplabels span { flex:1; text-align:center; font-size:6.5px; font-weight:bold; letter-spacing:.7px;
    color:#766a60; transition:color .35s, text-shadow .35s; }
  #steplabels span.past { color:#b49a86; }
  #steplabels span.on   { color:var(--led,var(--claude)); text-shadow:0 0 6px var(--led,var(--claude)); }

  /* ── ROLE: the agent's ID card (who + what they do) ─────────── */
  #role { margin-top:11px; width:158px; padding-top:9px; text-align:center; position:relative;
    border-top:1px solid rgba(255,255,255,0.09); }
  #role::before { content:''; position:absolute; top:-1px; left:50%; transform:translateX(-50%);
    width:34px; height:1px; background:var(--led,var(--claude)); box-shadow:0 0 6px var(--led,var(--claude)); opacity:.75; }
  body[data-state="idle"] #role::before { background:#9a8d80; box-shadow:none; opacity:.4; }
  #role .who { color:var(--led,var(--claude)); font-size:8.5px; font-weight:bold; letter-spacing:1.2px;
    text-transform:uppercase; text-shadow:0 0 7px var(--led,var(--claude)); }
  body[data-state="idle"] #role .who { color:#9a8d80; text-shadow:none; }
  #role .what { margin-top:4px; color:#bcae9e; opacity:.8; font-size:7.5px; letter-spacing:.2px;
    line-height:1.4; }

  @keyframes ledpulse { 0%,100%{ opacity:1; box-shadow:0 0 6px var(--led,var(--claude)); } 50%{ opacity:.5; box-shadow:0 0 13px var(--led,var(--claude)); } }
  @keyframes halo { 0%,100%{ box-shadow:0 8px 30px rgba(0,0,0,.42), 0 0 14px var(--led,var(--claude))40, inset 0 1px 0 rgba(255,255,255,0.18); }
    50%{ box-shadow:0 8px 32px rgba(0,0,0,.46), 0 0 30px var(--led,var(--claude))99, inset 0 1px 0 rgba(255,255,255,0.24); } }
  @keyframes slide { from{ background-position:220% 0 } to{ background-position:-220% 0 } }
  @keyframes indet { 0%{ left:-42% } 100%{ left:100% } }
</style>
</head>
<body data-state="idle" data-activity="idle" data-source="you">
  <div id="capsule">
    <div id="dot"></div>
    <div id="btns"><div id="reduce" class="btn" title="Hide (⌘⇧B)">_</div><div id="del" class="btn" title="Fermer">x</div></div>
    <div id="screen"><canvas id="scr"></canvas><div id="crt"></div></div>
    <div id="label">IDLE</div>
    <div id="detail"><span class="dot"></span><span class="txt"></span></div>
    <div id="progress"><div class="seg"><span class="fill"></span></div><div class="seg"><span class="fill"></span></div><div class="seg"><span class="fill"></span></div><div id="indet"><span></span></div></div>
    <div id="steplabels"><span>DISTILL</span><span>ORGANIZE</span><span>SAVE</span></div>
    <div id="role"><div class="who"></div><div class="what"></div></div>
  </div>

<script>
  const nodeRequire = window.require;
  const fs = nodeRequire('fs'); const os = nodeRequire('os'); const path = nodeRequire('path');
  const { ipcRenderer } = nodeRequire('electron');
  const STATUS = path.join(os.homedir(), 'claude-brain', 'state', 'status.json');
  document.getElementById('reduce').onclick = () => ipcRenderer.send('cap-hide');
  document.getElementById('del').onclick    = () => ipcRenderer.send('cap-quit');

  /* ===================== SHARED STATE ===================== */
  const body=document.body, elLabel=document.getElementById('label');
  const elDetailTxt=document.querySelector('#detail .txt');
  let cur={state:'idle',activity:'idle',source:'you',detail:''};
  let lastBusy=0, hiddenByIdle=false;
  const MAP = { idle:'IDLE', distilling:'DISTILLING', filing:'FILING', correcting:'CORRECTING',
    mapping:'MAPPING', gardening:'ORGANIZING', committing:'SAVING', challenging:'CHALLENGING',
    archiving:'ARCHIVING', synthesizing:'SYNTHESIZING', auditing:'AUDITING', architecting:'ARCHITECTING' };
  const PHASE_OF = { distilling:0, gardening:1, filing:1, correcting:1, mapping:1, challenging:1, archiving:1, synthesizing:1, architecting:1, committing:2 };
  // SIGNATURE colour per agent → you tell who is working at a glance (the colour channel was unused before).
  const ACCENT = { idle:'#d59570',    // "rested" terracotta → the mascot is alive at rest (no more dull grey)
    distilling:'#c77b5a',                                                   // distillateur — terracotta
    gardening:'#61e6a0', filing:'#61e6a0', correcting:'#61e6a0', mapping:'#61e6a0', // gardener — ONE single green: same agent = same colour (the SCENE differentiates the sub-task)
    architecting:'#5ad7e6',                                                 // architecte — cyan
    challenging:'#e0685e',                                                  // challenger — rouge
    archiving:'#f2c94c',                                                    // archiviste — ambre
    synthesizing:'#b78be6',                                                 // synthesizer — purple
    auditing:'#7aa6e0',                                                     // mechanic — steel blue
    committing:'#e0a85e' };                                                 // sauvegarde git — or
  // EXPRESSION per agent character (read by critter through _expr): the creature is no longer only
  //        coloured, it is EXPRESSIVE. focus=concentrating · wide=alert · sleepy=heavy lids · skeptical=narrowed eye · sparkle=bright.
  const EXPR = { idle:'happy', distilling:'focus', gardening:'happy', filing:'happy',
    correcting:'focus', mapping:'wide', architecting:'wide', challenging:'skeptical',
    archiving:'sleepy', synthesizing:'sparkle', auditing:'focus', committing:'happy' };
  // Role PROP per activity (moved back onto the CENTRED avatar, now that the scene no longer draws the creature).
  const ACC_OF = { distilling:'chem', gardening:'flower', filing:'flower', correcting:'flower', mapping:'flower',
    challenging:'monocle', archiving:'glasses', synthesizing:'nodes', auditing:'cap', architecting:'hardhat' }; // committing/idle : aucun
  // Each activity's role IN THE ARCHITECTURE — the exact text shown at the bottom (idle included).
  const ROLE = {
    idle:        ['THE 8 AGENTS',     'at rest · the trunk keeps watch'],   // condensed: no wall of 8 lines
    distilling:  ['DISTILLER',        'extracts the durable notes & lessons from the finished session'],
    gardening:   ['GARDENER',         'files, deduplicates, weaves [[ ]] links, masks secrets'],
    filing:      ['GARDENER',         'files each note into the right section of MEMORY.md'],
    correcting:  ['GARDENER',         'corrects and sharpens the content of a note'],
    mapping:     ['GARDENER',         'mapping: links the notes into the trunk index'],
    architecting:['ARCHITECT',        'global cohesion: weaves cross-domain bridges, spots islands'],
    committing:  ['git BACKUP',       'versions the growth of the trunk (lossless layer)'],
    challenging: ['CHALLENGER',       'tests the knowledge: stale, false, contradicted, oversold'],
    archiving:   ['ARCHIVIST',        'prunes dead weight — proposes, never deletes'],
    synthesizing:['SYNTHESIZER', 'connects a cross-cutting theme across several projects'],
    auditing:    ['MECHANIC',    'audits & repairs the machine: hooks, wiring, agents, capsule'],
  };
  const elRoleWho=document.querySelector('#role .who'), elRoleWhat=document.querySelector('#role .what');
  const SEGS = [...document.querySelectorAll('#progress .seg')];
  const STEPL = [...document.querySelectorAll('#steplabels span')];
  let celebrateUntil = 0;
  let _expr = 'happy';   // current expression of the creature (set by render() from the active agent)
  let _compose = false;  // while a scene renders, we SUPPRESS the creature the scene would draw
                         //   (scenes draw only their props) → the creature is drawn CENTRED, separately.
  function celebrate(){ celebrateUntil = Date.now() + 1500; if(!REDUCE) burst(50,34); } // no particles under reduced-motion
  // Agents with no real 3-phase pipeline → indeterminate activity bar (not a fake frozen ORGANIZE phase).
  const INDET = new Set(['challenging','archiving','synthesizing','architecting','auditing']);
  function renderProgress(busy, activity){
    if(!busy){ body.dataset.prog='off'; SEGS.forEach(s=>s.className='seg'); STEPL.forEach(s=>s.className=''); return; }
    if(INDET.has(activity)){ body.dataset.prog='indet'; SEGS.forEach(s=>s.className='seg'); STEPL.forEach(s=>s.className=''); return; }
    body.dataset.prog='phase';
    const ph=(activity in PHASE_OF)?PHASE_OF[activity]:1;
    SEGS.forEach((s,i)=>{ s.className='seg '+(i<ph?'done':i===ph?'active':'pending'); });
    STEPL.forEach((s,i)=>{ s.className=(i<ph)?'past':(i===ph)?'on':''; });
  }
  let lastPhase=-1, wasBusy=false, faceCur=0;
  let lastSeenAct=null, lastSeenTs=0;   // short memory: last activity seen (for the idle screen)
  const ago = s => s<60 ? 'JUST NOW' : s<3600 ? Math.floor(s/60)+' MIN AGO' : Math.floor(s/3600)+' H AGO';
  function trackSteps(busy, activity){
    const indet = busy && INDET.has(activity);
    const ph=busy?((activity in PHASE_OF)?PHASE_OF[activity]:1):-1;
    // only celebrate REAL pipeline progress (not an indeterminate agent starting up)
    if(busy && !indet && lastPhase>=0 && ph>lastPhase) celebrate();
    else if(!busy && wasBusy) celebrate();
    lastPhase=ph; wasBusy=busy;
  }
  function readStatus(){
    fs.readFile(STATUS,'utf8',(err,data)=>{
      let st={state:'idle'}; if(!err){ try{ st=JSON.parse(data);}catch(e){} }
      const now=Date.now()/1000; let state=st.state||'idle';
      // heartbeat window (30 s): auto_maintain refreshes ts every 5 s during long
      // passes d'agent (heartbeat) → la capsule ne clignote plus en idle au milieu du travail ; 30 s = filet si un tick saute.
      if(state==='busy' && (now-(st.ts||0))>30) state='idle';
      cur={ state, activity: state==='busy'?(st.activity||'gardening'):'idle', source:st.source||'you', detail:st.detail||'' };
      if(state==='busy'){ lastSeenAct=cur.activity; lastSeenTs=now; }   // remembered for the idle screen
      body.dataset.state=state; body.dataset.activity=cur.activity; body.dataset.source=cur.source;
      const accent = ACCENT[cur.activity]||ACCENT.idle;
      body.style.setProperty('--led', accent);
      applyBodyTint(accent);   // recolours the creature for the current agent
      elLabel.textContent = state==='busy' ? MAP[cur.activity]||'WORKING' : 'IDLE';
      const role = ROLE[cur.activity] || ROLE.idle;
      // detail: when busy = live signal (the "AGENT — " prefix is dropped so it does not duplicate the ID card);
      //          when idle = short memory "<agent> · X ago" (fills the dead space usefully)
      let det = '';
      if(state==='busy'){
        det = cur.detail||'';
        if(det && role[0]){
          const who = role[0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
          det = det.replace(new RegExp('^\\s*'+who+'\\s*[—–-]\\s*','i'),'');
        }
      } else if(lastSeenAct){
        det = ((ROLE[lastSeenAct]||['',''])[0])+' · '+ago(now-lastSeenTs);
      }
      body.dataset.last = (state!=='busy' && lastSeenAct) ? '1' : '0';
      elDetailTxt.textContent = det;
      elRoleWho.textContent = role[0]; elRoleWhat.textContent = role[1];
      renderProgress(state==='busy', cur.activity);
      trackSteps(state==='busy', cur.activity);
      if(state==='busy'){ lastBusy=now; ipcRenderer.send('cap-show'); hiddenByIdle=false; }
      else if(!hiddenByIdle && lastBusy && (now-lastBusy)>12){ ipcRenderer.send('cap-hide'); hiddenByIdle=true; }
    });
  }

  /* ===================== PIXEL ENGINE — the creature ===================== */
  // palette : 0 fond, 1 terracotta ombre, 2 terracotta, 3 terracotta clair, 4 noir,
  //           5 gris prop, 6 gris clair, 7 verre clair, 8 bleu/LED, 9 blanc
  const PAL = ['#161412','#9c5638','#c77b5a','#e0a585','#0c0b0a','#9a9082','#dcd3c3','#cfe6e6','#79b58a','#f3ece2','#4a463f','#857f74','#c6bfb0',
               '#4a463f','#857f74','#c6bfb0'];  // props (5 body, 6 face, 11 grain, 12 highlight) lifted → the action rises out of the black
  // 10/11/12 = fixed greys (props, accessories, grain). 13/14/15 = the creature's body (shadow/body/rim),
  //            dynamically RE-TINTED from the agent's colour (see applyBodyTint).
  // colour tools: recolour the creature from the current agent's accent
  const _hx = h => { h=h.replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; };
  const _hex = (r,g,b) => '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
  const _mix = (a,b,t) => { const A=_hx(a),B=_hx(b); return _hex(A[0]+(B[0]-A[0])*t, A[1]+(B[1]-A[1])*t, A[2]+(B[2]-A[2])*t); };
  // HSL for a HUE-SHIFTED ramp: the hue rotates along the ramp instead of
  // mixing towards black/white (which gives a muddy ramp). Shadow = cooler + desaturated (hue −),
  // light = warmer + saturated (hue +).
  const _r2hsl = hex => { let [r,g,b]=_hx(hex).map(v=>v/255); const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;
    let h=0,s=0,l=(mx+mn)/2; if(d){ s=l>0.5?d/(2-mx-mn):d/(mx+mn);
      h = mx===r ? (g-b)/d+(g<b?6:0) : mx===g ? (b-r)/d+2 : (r-g)/d+4; h*=60; } return [h,s,l]; };
  const _hsl2hex = (h,s,l)=>{ h=((h%360)+360)%360; s=Math.max(0,Math.min(1,s)); l=Math.max(0,Math.min(1,l));
    const c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h/60)%2-1)), m=l-c/2; let r,g,b;
    if(h<60)[r,g,b]=[c,x,0]; else if(h<120)[r,g,b]=[x,c,0]; else if(h<180)[r,g,b]=[0,c,x];
    else if(h<240)[r,g,b]=[0,x,c]; else if(h<300)[r,g,b]=[x,0,c]; else [r,g,b]=[c,0,x];
    return _hex((r+m)*255,(g+m)*255,(b+m)*255); };
  let _lastTint=null;
  function applyBodyTint(accent){
    if(accent===_lastTint) return;  // ne recalcule que si la couleur change
    _lastTint=accent;
    const [h,s,l]=_r2hsl(accent);
    PAL[13]=_hsl2hex(h-26, Math.max(0,s*0.85-0.04), Math.max(0.04,l-0.30));  // shadow: cool, desaturated, dark
    PAL[14]=_hsl2hex(h,    Math.min(1,s+0.02),       Math.max(0.10,l-0.02));  // corps : mid (≈ accent)
    PAL[15]=_hsl2hex(h+20, Math.min(1,s+0.10),       Math.min(0.92,l+0.24));  // rim: warm, saturated, light
  }
  const W=100, H=94;
  const scr=document.getElementById('scr');
  const g=scr.getContext('2d');
  const flr=Math.floor, sin=Math.sin, cos=Math.cos, abs=Math.abs, rnd=Math.round;
  // 4K RENDERING: backing = real screen pixels, art scaled by an INTEGER factor (crisp square pixels)
  let DEV={w:W,h:H,s:1,ox:0,oy:0};
  function setupCanvas(){
    const dpr=window.devicePixelRatio||1;
    const cssW=scr.clientWidth||154, cssH=scr.clientHeight||144;
    const dw=Math.max(W,Math.round(cssW*dpr)), dh=Math.max(H,Math.round(cssH*dpr));
    scr.width=dw; scr.height=dh;
    const s=Math.max(1,Math.floor(Math.min(dw/W,dh/H)));        // INTEGER factor → no smeared pixels
    DEV={w:dw,h:dh,s,ox:Math.floor((dw-W*s)/2),oy:Math.floor((dh-H*s)/2)};
    g.setTransform(s,0,0,s,DEV.ox,DEV.oy);
    g.imageSmoothingEnabled=false;
  }
  let _dpr=0; setupCanvas();
  window.addEventListener('resize', setupCanvas);
  const r=(x,y,w,h,p)=>{ g.fillStyle=PAL[p]; g.fillRect(flr(x),flr(y),Math.max(1,flr(w)),Math.max(1,flr(h))); };
  const px=(x,y,p)=>{ g.fillStyle=PAL[p]; g.fillRect(flr(x),flr(y),1,1); };

  // particle burst (end of a step)
  let parts=[];
  function burst(cx,cy){ for(let i=0;i<14;i++){ const a=Math.random()*6.283, sp=18+Math.random()*36;
    parts.push({x:cx,y:cy,vx:cos(a)*sp,vy:sin(a)*sp-18,life:0.6+Math.random()*0.5,age:0}); } }
  function stepDrawParts(dt){ for(const p of parts){ p.vy+=95*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.age+=dt; }
    parts=parts.filter(p=>p.age<p.life);
    for(const p of parts){ const k=1-p.age/p.life, sz=k>0.5?2:1; r(p.x,p.y,sz,sz, k>0.6?3:2); } }

  // the creature sprite (10 wide) — close antennae, big eyes, rounded body; 2 leg frames
  // silhouette with a FACE: small pointed ears (row 0, cols 2 & 7), eyes kept
  //      row 4 (accessories unchanged), 'M' mouth row 5 → reads as "creature", no longer "Space Invader".
  // Full SPRITE with NATIVE ARMS marked 'A' (they must be native, not an appendage)
  //   → [[membres-avatar-natifs-pas-appendice]]). The arms BRANCH from the shoulders and FLANK the body
  //   (cols 1 & 8), short (2 rows) and raised → they read as "arms", not "legs". Same grid / tiling
  //   / ramp = real fusion. Sway = horizontal offset of the 'A' cells (slow, accented pendulum).
  // LEGS REMOVED: body only, rounded bottom, no limbs.
  const BODY = [
    "  X    X  ",   // antennes
    " XXXXXXXX ",   // front
    "XXEXXXXEXX",   // yeux (cols 2 & 7)
    "XXXXXXXXXX",   // ventre
    " XXXXXXXX ",   // bas arrondi
  ];
  // Role PROP (headgear / garment / object, consistent with the agent's function).
  // Drawn in FINE coordinates from the head geometry (ox,oy = top-left corner of the
  // body; cw,chh = size of one body "cell", which already includes squash/stretch/pivot).
  //   Landmarks: head centre X = ox+5·cw · head top Y = oy · eye line Y = oy+4·chh
  //             œil gauche X = ox+2·cw · œil droit X = ox+7·cw
  function drawAcc(id, ox, oy, cw, chh){
    const HX=ox+5*cw, u=cw, eL=ox+2*cw, eR=ox+7*cw, eyeY=oy+2*chh;  // eyes on row 2 (slimmer body) → glasses/monocle aligned
    if(id==='flower'){                                   // GARDENER — small daisy (petal cross + heart + stem/leaf)
      const p=Math.max(1,flr(u*0.55)), cx=HX-flr(p*0.5), cy=oy-chh*0.55;
      r(cx+flr(p*0.1), cy+p*1.1, Math.max(1,flr(p*0.8)), chh*1.0, 8);     // tige verte
      r(cx+p, cy+p*1.9, p, Math.max(1,flr(p*0.7)), 8);                    // feuille
      r(cx-p, cy, p,p,9); r(cx+p, cy, p,p,9);                             // left/right petals
      r(cx, cy-p, p,p,9); r(cx, cy+p, p,p,9);                             // top/bottom petals
      r(cx, cy, p,p,2); px(cx+flr(p*0.4), cy+flr(p*0.3), 3);              // cœur terracotta + point clair
    } else if(id==='chem'){                              // DISTILLER — safety goggles (wide tinted band + strap)
      const y=eyeY-chh*0.45, h=chh*1.7;
      const x0=eL-u*0.9, x1=eR+u*1.0, ww=x1-x0;
      r(ox+u*0.1, y+h*0.3, ww+u*1.6, chh*0.45, 5);       // strap around the head (behind)
      r(x0, y, ww, h, 4);                                // monture sombre du masque
      r(x0+1, y+1, ww-2, h-2, 7);                        // light tinted lens (a single visor)
      r(x0+ww*0.5-0.5, y+1, 1, h-2, 4);                  // pont central entre les deux verres
      r(x0+ww*0.24, y+2, 2, 2, 9); r(x0+ww*0.72, y+2, 2, 2, 9); // reflets
    } else if(id==='hardhat'){                           // ARCHITECT — white hard hat with a wide brim
      const ty=oy-chh*0.35;
      r(HX-u*1.9, ty+chh*0.5, u*3.8, chh*0.85, 9);       // base of the dome
      r(HX-u*1.3, ty, u*2.6, chh*0.7, 9);                // top of the dome
      r(HX-u*1.3, ty, u*2.6, chh*0.28, 12);              // reflet
      r(HX-u*0.3, ty-chh*0.3, u*0.6, chh*0.5, 5);        // crest / vent
      r(HX-u*2.5, ty+chh*1.25, u*5.0, chh*0.45, 6);      // brim (overhangs on both sides)
      r(HX-u*2.5, ty+chh*1.65, u*5.0, chh*0.25, 4);      // shadow under the brim
    } else if(id==='monocle'){                           // CHALLENGER — monocle on the right eye + chain
      const w=u*2.1, h=chh*2.0, x=eR-u*0.8, y=eyeY-chh*0.7;
      r(x,y,w,h,4); r(x+1,y+1,w-2,h-2,7);                // monture + verre
      const cc=Math.max(1,flr(u*0.45));                   // "nibbled" corners → a round lens, not a square one
      r(x,y,cc,cc,11); r(x+w-cc,y,cc,cc,11); r(x,y+h-cc,cc,cc,11); r(x+w-cc,y+h-cc,cc,cc,11);
      r(x+w*0.6,y+cc,Math.max(1,flr(u*0.4)),Math.max(1,flr(chh*0.4)),9); // reflet
      r(x+w*0.45, y+h, Math.max(1,flr(u*0.25)), chh*1.5, 4);            // hanging chain
    } else if(id==='glasses'){                           // ARCHIVISTE — lunettes de lecture (deux verres + pont)
      const y=eyeY-chh*0.55, h=chh*1.5, w=u*1.9;
      const lx=eL-u*0.8, rx=eR-u*1.0;
      r(lx,y,w,h,4); r(lx+1,y+1,w-2,h-2,7);
      r(rx,y,w,h,4); r(rx+1,y+1,w-2,h-2,7);
      r(lx+w, y+h*0.45, rx-(lx+w), Math.max(1,chh*0.2), 4); // pont
      r(lx+w*0.6,y+2,2,2,9); r(rx+w*0.6,y+2,2,2,9);      // reflets
    } else if(id==='nodes'){                             // SYNTHESIZER — constellation: 3 linked nodes in a TRIANGLE, the apex glows
      const y=oy-chh*0.55, s2=Math.max(2,flr(u*0.85));
      const P=[[ox+2.3*cw,y+chh*0.55],[HX,y-chh*0.4],[ox+7.7*cw,y+chh*0.55]];
      g.strokeStyle=PAL[11]; g.lineWidth=1;
      g.beginPath(); g.moveTo(P[0][0],P[0][1]); g.lineTo(P[1][0],P[1][1]); g.lineTo(P[2][0],P[2][1]); g.closePath(); g.stroke();
      P.forEach((p,i)=>{ r(p[0]-flr(s2/2), p[1]-flr(s2/2), s2, s2, 2); px(p[0],p[1], 9);   // nœud terracotta + cœur clair
        if(i===1){ px(p[0]-1,p[1]-1,3); px(p[0]+1,p[1]-1,3); } });                          // slight sparkle on the apex
    } else if(id==='cap'){                               // MECHANIC — worker's cap (domed crown + front peak)
      const ty=oy-chh*0.05;
      r(HX-u*1.5, ty+chh*0.5, u*3.0, chh*0.7, 2);        // base de la calotte (large)
      r(HX-u*1.1, ty+chh*0.15, u*2.4, chh*0.5, 2);       // intermediate step → rounded
      r(HX-u*0.7, ty-chh*0.2, u*1.6, chh*0.45, 2);       // domed top
      r(HX-u*0.7, ty-chh*0.2, u*1.6, chh*0.18, 12);      // highlight on the dome
      r(HX-u*0.05, ty-chh*0.45, u*0.5, chh*0.3, 2);      // bouton au sommet
      r(HX-u*2.9, ty+chh*1.0, u*1.7, chh*0.4, 2);        // peak (juts left, same tint)
      r(HX-u*2.9, ty+chh*1.35, u*1.7, chh*0.16, 4);      // tranche d'shadow under the brim
    }
  }
  // Expressive MOUTH, driven by mood (4=dark line, 15=light lip). Fine coordinates.
  // NEUTRAL MOUTH that MOVES (no emotion: neither smile nor frown). `open` 0..1 = opening animated by the action.
  function drawMouth(mcx, my, u, ch, open){
    open=Math.max(0,Math.min(1,open||0));
    const w=Math.max(1,flr(u*1.8)), base=ch*0.16, h=Math.max(1,flr(base+open*ch*0.55));
    r(mcx-w/2, my-flr((h-base)*0.4), w, h, 4);                       // centred neutral line that thickens as it opens
    if(open>0.45) r(mcx-w/2+1, my+flr(h*0.35), Math.max(1,w-2), 1, 15); // light lip when wide open
  }
  // (drawArms()/drawLimb() removed: the arms are now NATIVE in the sprite grid,
  //  see ARM_ROWS + the row offset in critter(). No limb layer is pasted on top any more.)
  // draws the creature: (cx,cy)=centre, s=pixel size (chunky), opt.blink/look
  function critter(cx, cy, s, t, opt={}){
    if(_compose) return;                          // while composing, the scene does NOT draw the creature (it is drawn centred, separately)
    const expr = opt.expr || _expr || 'happy';   // P2b : humeur (pilote la forme des yeux)
    const blink = opt.blink ?? ((t%3.2)<0.14);
    const rows = BODY; const w=10, h=rows.length; const armTop=rows.findIndex(rw=>rw.indexOf('A')>=0); // V17 : armTop dynamique
    // CALMED MOTION (no frantic cadence at all). Breathing and
    //   bounce slowed + amplitudes reduced → alive but composed. Before: walk·5 = ~2.5 Hz (frantic).
    const walk=t*(opt.fast?1.9:1.4);                            // slow cadence (alive, not frantic)
    let sy=1+sin(t*1.6)*0.08 + abs(sin(walk*Math.PI))*0.035;   // respiration douce (squash & stretch)
    let sx=1-sin(t*1.6)*0.08 - abs(sin(walk*Math.PI))*0.035;
    let hop=-abs(sin(walk*Math.PI))*(opt.fast?1.2:0.7);        // rebond discret (poids du pas)
    const left=celebrateUntil-Date.now();
    if(left>0){ const p=1-left/1500; hop+=-abs(sin(p*Math.PI*2))*9; sy*=1+sin(p*Math.PI*4)*0.12; sx*=1-sin(p*Math.PI*4)*0.12; }
    const press=opt.press||0;                                  // IMPACT DEFORMATION: squashes when pressing/handling
    sy*=1-0.22*press; sx*=1+0.22*press; hop+=press*2.4;        // vertical squash + widening + settling towards the ground
    const reach=opt.reach, hand=opt.hand, ap=hand||reach;       // ap = point of interest (gaze + lean)
    // ORIENTATION: the creature PIVOTS towards what it HANDLES (hand mode only → faces front again at rest)
    const faceT = hand ? Math.max(-1,Math.min(1,(hand.x-cx)/8)) : 0;
    faceCur += (faceT-faceCur)*0.15; const face=faceCur;
    const turnSq = 1-0.26*abs(face);                             // raccourci horizontal = perspective du 3/4
    const cyy=cy+hop, cw=s*sx*turnSq, chh=s*sy, cwI=Math.ceil(cw), chI=Math.ceil(chh);
    let lean=ap?Math.max(-1.5,Math.min(4,(ap.x-cx)*0.045)):0;    // se penche vers l'action
    let recoil=0; if(ap){ const edge=cx+w*s*0.5; recoil=-Math.min(8,Math.max(0,(edge+4)-ap.x)); } // RECULE si l'objet entre dans sa bulle
    const ox=cx-w*cw/2+lean+recoil+face*2.6, oy=cyy-h*chh/2;     // pivote + recule
    // ground shadow: shrinks on a jump, follows the recoil/pivot
    const gy=cy+h*s/2, swd=(w*s*0.62)*(1-(-hop)/16);
    r(cx-swd/2+recoil+face*2.6, gy, swd, Math.max(1,flr(s*0.35)), 4);
    // regard : suit le point d'action
    const lx=ap?Math.max(-1,Math.min(1,(ap.x-cx)/20)):(opt.look??0);
    const ly=ap?Math.max(-1,Math.min(1,(ap.y-cy)/20)):(opt.looky??0);
    // EXACT-EDGE TILING: a cell's width = next edge − current edge, so
    // cellules sont JOINTIVES sans se chevaucher. Fini l'effet « gaufre » (chevauchement d'1px
    // painted twice at 0.8 opacity → a dark seam gridding the whole body).
    const xe = i => rnd(ox + i*cw), ye = j => rnd(oy + j*chh);
    g.globalAlpha=0.88+0.04*sin(t*2.2);                          // holo flicker calmed (t*7 before = cheap strobe)
    const armSwing=sin(t*1.05)*cw*0.34;                          // pendule LENT (~0.17 Hz), ample
    const cellF=(jj,ii)=>{ const c=(jj>=0&&jj<h&&ii>=0&&ii<w)?rows[jj][ii]:' '; return c==='X'||c==='A'||c==='E'; }; // cellule « pleine » ?
    for(let j=0;j<h;j++){ for(let i=0;i<w;i++){ const ch=rows[j][i];
      const isArm = ch==='A';
      // limbs: anchored at the top (against the belly) + FLARING outwards (wider at the bottom) + gentle sway.
      const armDepth=j-armTop, splay=isArm?(i<5?-1:1)*1.4*armDepth:0;
      const wob=(j===0)?sin(t*2.4+i*1.6)*0.5:(isArm?splay+armSwing*armDepth:0);
      const X=xe(i)+wob, Y=ye(j), Wc=xe(i+1)-xe(i), Hc=ye(j+1)-ye(j);
      if(ch==='X'||isArm){ r(X,Y,Wc,Hc,14);                                  // body AND arms = the SAME cells:
        if(!cellF(j-1,i)) r(X,Y,Wc,Math.max(1,flr(Hc*0.34)),15);            //   fill 14 + top rim, NOTHING else → total fusion (identical material)
      } else if(ch==='E'){
        const farEye=(face>0.35&&i<4)||(face<-0.35&&i>5); const isR=i>5;  // the far-side eye closes as it turns
        if(blink||farEye){ r(X,Y,Wc,Hc,14); r(X, Y+flr(Hc*0.5), Wc, Math.max(1,flr(Hc*0.3)), 4); } // closed eye (a line)
        else { r(X,Y,Wc,Hc,4);                                              // orbite sombre
          const ex=Math.max(-1.4,Math.min(1.4,lx+face*1.3)), ey=Math.max(-1,Math.min(1,ly));
          // richer EXPRESSION: eyelids (skin 13) + highlight + BROW for character
          let hw=Math.max(1,flr(Wc*0.42)), hh=Math.max(1,flr(Hc*0.42)), topLid=0, botLid=0, brow=0;
          if(expr==='wide'||expr==='sparkle'){ hw=Math.max(2,flr(Wc*0.66)); hh=Math.max(2,flr(Hc*0.66)); } // grand œil alerte/curieux
          else if(expr==='focus'){ topLid=flr(Hc*0.32); botLid=flr(Hc*0.26); hh=Math.max(1,flr(Hc*0.30)); brow=1; } // concentrating + brows
          else if(expr==='sleepy'){ topLid=flr(Hc*0.66); hh=Math.max(1,flr(Hc*0.24)); }                  // heavy lids
          else if(expr==='skeptical'){ if(isR){ topLid=flr(Hc*0.58); botLid=flr(Hc*0.10); } else { brow=1; } } // right narrowed + left brow raised
          // V5 : plus d'yeux « contents » (happy/idle = neutre, œil plein)
          if(topLid) r(X,Y,Wc,topLid,13); if(botLid) r(X,Y+Hc-botLid,Wc,botLid,13);
          const slitY=Y+topLid+flr(Hc*0.14)+ey, maxY=Y+Hc-botLid-hh;
          r(X+flr(Wc*0.2)+ex, Math.min(slitY,Math.max(Y+topLid,maxY)), hw, hh, 9);                       // reflet vif
          if(expr==='sparkle') px(X+flr(Wc*0.74)+ex, Y+flr(Hc*0.10)+ey, 9);                              // double sparkle
          if(brow) r(X+flr(Wc*0.08), Y-Math.max(1,flr(Hc*0.26)), Math.max(2,flr(Wc*0.84)), Math.max(1,flr(Hc*0.16)), 13); } // sourcil
      }
    }}
    // MOUTH REMOVED: the face is eyes only, as in the reference.
    //       drawMouth() is kept (uncalled) in case we ever want it back.
    // P3 — bande holographique : fine ligne claire qui balaie le corps de bas en haut
    { const band=oy + (h*chh) - ((t*22)%(h*chh)); g.globalAlpha=0.10;
      r(ox+cw*0.5, band, (w-1)*cw, Math.max(1,flr(chh*0.45)), 15); }
    g.globalAlpha=1;
    // Role PROP (hat/garment) — stamped onto the body grid, so it follows
    // the squash/stretch/pivot. Drawn AFTER the body (it passes over the head).
    if(opt.acc) drawAcc(opt.acc, ox, oy, cw, chh);
    // (NO arm is drawn any more — the "lasso" is gone. The object is held directly through opt.hand: coupling without a line.)
  }

  const SCENES = {};
  // ---- props in a UNIFIED STYLE: dark outline (4), grey body (5), light face (6),
  //      TERRACOTTA accent (2) reserved for the active element. The character always sits left. ----
  // soft shadow (rgba) — real depth on the ground / contact between objects
  function shadowRect(x,y,w,h,a){ g.fillStyle='rgba(0,0,0,'+a+')'; g.fillRect(flr(x),flr(y),Math.max(1,flr(w)),Math.max(1,flr(h))); }
  // grey BOX/object: volume (light from top-left) + material grain + contact shadow
  function box(x,y,w,h){
    shadowRect(x+2,y+h,w,3,0.42);                                // stronger contact shadow → the object rests on the ground, it does not float
    r(x,y,w,h,4);                                                // dark edge
    r(x+1,y+1,w-2,h-2,5);                                        // corps
    for(let j=3;j<h-1;j+=2) r(x+1,y+j,w-2,1,11);                 // grain horizontal (texture)
    r(x+1,y+1,w-2,1,12); r(x+1,y+1,1,h-2,12);                    // lit edges (top + left)
    r(x+2,y+1,Math.max(1,w-4),1,6);                             // surbrillance du dessus
    r(x+1,y+h-2,w-2,1,10); r(x+w-2,y+1,1,h-2,10);               // occlusion (bas + droite) → relief
  }
  // paper/screen PANEL: light face + fine lines (texture) + contact shadow
  function panel(x,y,w,h){
    shadowRect(x+2,y+h,w,3,0.36);                                // stronger ground contact
    r(x,y,w,h,4);                                                // cadre sombre
    r(x+1,y+1,w-2,h-2,6);                                        // face claire
    for(let j=2;j<h-1;j+=2) r(x+1,y+j,w-2,1,12);                 // lignes fines (papier/scanlines)
    r(x+1,y+1,w-2,1,9); r(x+1,y+1,1,h-2,9);                      // lit borders (top + left)
    r(x+1,y+h-2,w-2,1,5);                                        // ombre basse
  }
  function surface(){}   // (removed: the horizontal bar read as a "rope" tying the creature to the objects)
  // specular HIGHLIGHT: a spot of bright light → shiny material (glass / polished metal)
  function spec(x,y){ r(x,y,2,1,9); r(x,y+1,1,1,7); px(x+2,y,12); }
  // ACCENT GLOW: warm terracotta bloom radiating from the ACTIVE element (LED, essence, X…) — gentle breathing
  function glow(x,y,rad){ const p=0.85+0.15*sin(Date.now()/260); rad=rad*2.0*p;   // wider bloom + warm core → the ACTIVE element draws the eyel
    let gr=g.createRadialGradient(x,y,0,x,y,rad);
    gr.addColorStop(0,'rgba(255,212,172,0.95)'); gr.addColorStop(0.22,'rgba(242,168,122,0.72)');
    gr.addColorStop(0.55,'rgba(205,120,80,0.32)'); gr.addColorStop(1,'rgba(199,123,90,0)');
    g.fillStyle=gr; g.fillRect(x-rad,y-rad,rad*2,rad*2); }
  // scene ENVIRONMENT: depth with no hard edge anywhere (ambient light + vignette + gradient floor)
  function stage(){
    let amb=g.createLinearGradient(0,0,W,H);                    // soft light top-left → dark corners
    amb.addColorStop(0,'rgba(86,77,67,0.28)'); amb.addColorStop(0.5,'rgba(0,0,0,0)'); amb.addColorStop(1,'rgba(0,0,0,0.38)'); // P1 : coins moins noirs → props ne coulent plus
    g.fillStyle=amb; g.fillRect(0,0,W,H);
    let flo=g.createLinearGradient(0,H*0.5,0,H);                // floor: rising gloom, blurred edge (never a line)
    flo.addColorStop(0,'rgba(0,0,0,0)'); flo.addColorStop(1,'rgba(28,25,22,0.62)');
    g.fillStyle=flo; g.fillRect(0,H*0.5,W,H*0.5);
    let pool=g.createRadialGradient(50,62,2,50,62,30);          // key light re-centred under the avatar (the animation zone)
    pool.addColorStop(0,'rgba(168,150,128,0.50)'); pool.addColorStop(0.5,'rgba(150,132,112,0.20)'); pool.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=pool; g.fillRect(0,0,W,H);
  }

  // V22 — helpers d'ANIM FLUIDE : oscillation douce (ping-pong cosinus → 0→1→0, JAMAIS de teleport),
  //   sawtooth ONLY when masked by a fade, plus easing. Kills the "stutter" of raw t%n resets.
  const osc=(tt,P)=>0.5-0.5*cos(tt/P*6.2832);
  const saw=(tt,P)=>(tt/P)%1;
  const easeIO=x=>x<.5?2*x*x:1-(2-2*x)*(2-2*x)/2;
  const fadeWrap=c=>Math.max(0,Math.min(1,Math.min(c*5,(1-c)*5)));  // fond→1→fond sur un cycle saw (cache le wrap)

  // REST: the creature breathes, shifts its feet, blinks, gaze wandering
  SCENES.idle = (t)=>{ const bob=rnd(sin(t*2)*1.6);
    critter(50, 42+bob, 5, t, {look:rnd(sin(t*0.6)*1.2), looky:rnd(sin(t*0.9)*0.6)});   // V21 : avatar +1 (s=5)
    if((t%6)>5.3){ r(72,30-flr((t%6-5.3)/0.7*8),3,3,2);} };

  // DISTILLING: watching a still; the essence (terracotta) drips into the beaker
  SCENES.distilling = (t)=>{
    box(56,44,14,14); r(58,50,10,6,5);
    for(let i=0;i<2;i++){ const bc=saw(t*1.7+i*0.5,1); g.globalAlpha=fadeWrap(bc); px(60+i*3,50-bc*7,6); g.globalAlpha=1; } // bulles (montent + fade)
    r(60,40,4,4,4); r(62,41,12,2,4); r(72,42,2,12,4);                  // col + tube
    box(70,52,12,8);                                                    // beaker
    const niv=58-flr(osc(t,5)*4);                                       // V23 : niveau d'essence en oscillation douce (plus de saut)
    glow(76,niv+2,9); r(72,niv,8,58-niv,2);                            // lueur + essence terracotta
    spec(73,niv+1); spec(78,53); spec(58,46);
    const dp=saw(t,1.3); g.globalAlpha=fadeWrap(dp); r(72,52+dp*6,2,2,2); g.globalAlpha=1; // goutte (tombe + fade, pas de teleport)
  };

  // ORGANIZING (COUPLED): the HAND picks a note up and sets it down; the stack grows BECAUSE the hand sets it down.
  //   → one single system: note position = hand position. No separate timeline.
  // ORGANIZING redone, FLUID: a tidy stack of notes (coloured tabs) + one note gliding
  //   down and settling; the loop is hidden by a fade (zero teleporting); a green shoot breathing.
  SCENES.gardening = (t)=>{
    const x=58, baseY=62, cw2=20, tabs=[8,12,2];
    for(let i=0;i<3;i++){ panel(x, baseY-i*5, cw2, 5); r(x+2, baseY-i*5+1, 5,1, tabs[i]); } // tidy stack
    const topY=baseY-3*5;
    const c=saw(t,2.4), fy=30+easeIO(c)*(topY-7-30);                   // note gliding down (eased), faded loop
    g.globalAlpha=fadeWrap(c); panel(x, fy, cw2, 5); r(x+2, fy+1, 5,1, 2); g.globalAlpha=1;
    glow(x+cw2-4, topY-1, 4);                                          // lueur sur le sommet
    const gh=2+osc(t,3.5)*4; r(x+cw2-2, topY-gh, 1, gh, 8); r(x+cw2-3, topY-gh, 2,1, 8); // pousse qui respire
  };

  // SAUVEGARDER : pousse une disquette dans le lecteur (LED + barre terracotta)
  SCENES.committing = (t)=>{
    box(54,48,34,12); r(57,52,28,3,4); spec(56,49);                    // reader + slot + highlight
    if(osc(t,0.8)>0.5){ glow(85,51,6); r(84,50,2,2,2); }              // LED qui clignote (doux)
    r(54,62,34,4,4); r(55,63, flr(osc(t,3)*32),2, 2);                // V23 : barre de progression en oscillation
    const c=saw(t,2.6), k=easeIO(Math.min(1,c*1.4)), dx=78-flr(k*20); // disquette qui glisse dans la fente
    g.globalAlpha=fadeWrap(c); box(dx,44,15,12); r(dx+9,45,4,4,4); r(dx+2,50,11,4,6); g.globalAlpha=1;
  };

  // FILING: slides a note (terracotta tab) into a drawer cabinet
  SCENES.filing = (t)=>{
    box(56,40,28,24);                                                  // drawer cabinet
    r(58,48,24,1,4); r(58,56,24,1,4); r(66,44,6,2,4); r(66,60,6,2,4);  // dividers + fixed handles
    const c=saw(t,2.4), open=easeIO(osc(t,2.4))*5;                      // V23 : tiroir qui s'ouvre/ferme en douceur (osc)
    box(56-open,50,24,6); r(66,52,6,2,4); spec(58-open,51);            // drawer + handle + highlight
    const fy=26+easeIO(c)*20, fx=61;                                    // note gliding down (eased) + faded loop
    g.globalAlpha=fadeWrap(c); panel(fx,fy,16,8); r(fx,fy,5,2,2); glow(fx+2,fy+1,6); g.globalAlpha=1;
  };
  // CORRECTING : corrige une page (crayon terracotta en va-et-vient)
  SCENES.correcting = (t)=>{ panel(56,40,28,26);
    const sx=60+abs(((t*0.8)%2)-1)*18;
    for(let i=0;i<4;i++){ const ly=46+i*5;                            // line 1 is REWRITTEN (terracotta) as the pencil passes
      if(i===1){ const cut=Math.max(0,Math.min(20,flr(sx-60))); r(60,ly,cut,1,2); r(60+cut,ly,20-cut,1,4); }
      else r(60,ly,20,1,4); }
    glow(sx+1,52,5); r(sx,48,2,9,4); r(sx,48,2,2,2); r(sx-1,57,3,2,5); // crayon (corps gris, mine terracotta) + lueur de pointe
    spec(sx,49);
    for(let s=0;s<3;s++){ const sp=saw(t+s*0.33,1); g.globalAlpha=fadeWrap(sp); px(sx-2+s, 58+flr(sp*5), 6); } g.globalAlpha=1; // copeaux (tombent + fade)
  };
  // MAPPING: poring over a map (relief, dotted path, pulsing terracotta X, compass)
  SCENES.mapping = (t)=>{ panel(54,30,32,28);
    r(60,48,4,3,5); r(59,49,1,2,5); r(66,49,3,3,5);                    // montagnes
    const wp=[[60,52],[68,46],[76,48],[80,38]];
    const c=saw(t,2.6), prog=easeIO(c)*(wp.length-1);                  // the route draws itself (eased) + faded loop
    g.globalAlpha=fadeWrap(c);
    for(let i=0;i<wp.length-1 && i<=prog;i++){ const a=wp[i],b=wp[i+1], seg=Math.min(1,prog-i);
      for(let k=0;k<=6;k++) if(k%2===0 && k/6<=seg) px(a[0]+(b[0]-a[0])*k/6,a[1]+(b[1]-a[1])*k/6,4); }
    g.globalAlpha=1;
    for(const w of wp) r(w[0]-1,w[1]-1,2,2,5);
    const pr=1+flr(osc(t,0.9)*2.5); glow(80,38,7); r(80-pr,37,pr*2+1,1,2); r(80-1,37-pr+1,1,pr*2+1,2); // X qui pulse (doux)
    r(57,53,4,4,4); px(59,54,2); spec(57,53);                          // boussole + reflet
  };
  // CHALLENGING: inspecting a document with a magnifier (terracotta handle)
  SCENES.challenging = (t)=>{ panel(56,42,28,22); for(let i=0;i<3;i++) r(60,48+i*6,20,1,4);
    const mx=rnd(64+sin(t*1.5)*9), my=rnd(50+cos(t*1.5)*4);
    const li=Math.max(0,Math.min(2,Math.round((my-48)/6)));            // V4 : sous la loupe, le passage suspect S'ALLUME (terracotta) + « ! »
    glow(mx,48+li*6,5); r(mx-3,48+li*6,6,1,2);
    if((t%1.4)<0.7){ r(mx-1,my-8,1,3,2); px(mx-1,my-4,2); }            // « ! » qui clignote
    r(mx-4,my-4,8,8,4); r(mx-3,my-3,6,6,6); spec(mx-1,my-2); r(mx+3,my+3,3,5,2); // magnifier: lens + highlight + handle
  };
  // V22 — ARCHIVING refait, FLUIDE : pile de cartons GRIS (poids mort, froid) + un carton qui descend
  //   gently down to be archived; faded loop (zero teleporting).
  SCENES.archiving = (t)=>{
    const x=64, baseY=62, bw=20;
    for(let i=0;i<3;i++){ const by=baseY-i*7;                          // stacked boxes (grey/cold)
      r(x,by,bw,7,4); r(x+1,by+1,bw-2,5,10); r(x+flr(bw/2)-1,by,2,7,5); r(x+1,by+1,bw-2,1,11); }
    const topY=baseY-3*7;
    const c=saw(t,2.6), by=30+easeIO(c)*(topY-8-30);                   // carried box gliding down
    g.globalAlpha=fadeWrap(c);
    box(x+2, by, bw-4, 8); r(x+flr(bw/2)-1, by, 2,8,4); r(x+3, by+2, 5,2, 6);  // coloured box + tape + label
    g.globalAlpha=1;
    glow(x+bw-4, topY, 4);                                             // discreet glow on the stack
  };
  // SYNTHESIZING: weaving a network — a pulse travels and LIGHTS the nodes (terracotta)
  SCENES.synthesizing = (t)=>{
    const N=[[58,34],[82,38],[60,56],[82,58],[70,46]];
    const E=[[4,0],[4,1],[4,2],[4,3],[0,1],[2,3]];
    g.strokeStyle=PAL[5]; g.lineWidth=1;
    for(const [a,b] of E){ g.beginPath(); g.moveTo(N[a][0]+.5,N[a][1]+.5); g.lineTo(N[b][0]+.5,N[b][1]+.5); g.stroke(); }
    const ei=flr(t*1.2)%E.length, e=E[ei], k=(t*1.2)%1, a=N[e[0]], b=N[e[1]];
    const ix=a[0]+(b[0]-a[0])*easeIO(k), iy=a[1]+(b[1]-a[1])*easeIO(k);
    g.globalAlpha=fadeWrap(k); glow(ix,iy,5); r(ix-1,iy-1, 3,3, 2); g.globalAlpha=1; // pulse faded at both ends → no edge jump
    for(let i=0;i<N.length;i++){ const n=N[i], lit=(k>0.8 && i===e[1]);
      if(lit) glow(n[0],n[1],7);                                      // le nœud s'ALLUME (lueur)
      r(n[0]-3,n[1]-3,6,6,4); r(n[0]-2,n[1]-2,4,4, lit?2:5); }
  };

  // V22 — AUDITING refait, FLUIDE : 2 engrenages qui tournent en continu (lisse) + moyeu terracotta qui
  //   turns + a wrench tightening in GENTLE bursts (cosine oscillation, no more jerky back-and-forth).
  SCENES.auditing = (t)=>{
    box(54,42,28,20);                                                  // bloc machine
    const cx=66, cy=52, rot=t*1.3, R=8;
    r(cx-R+1,cy-R+1,(R-1)*2,(R-1)*2,4);                                // contour sombre du grand rouage
    for(let i=0;i<8;i++){ const a=rot+i*Math.PI/4; r(cx+cos(a)*R-1, cy+sin(a)*R-1, 2,2, 5); } // 8 dents
    r(cx-R+2,cy-R+2,(R-2)*2,(R-2)*2,5); r(cx-R+2,cy-R+2,(R-2)*2,1,11);  // corps gris + grain haut
    glow(cx,cy,7); r(cx-2,cy-2,4,4,4);                                  // lueur + moyeu sombre
    r(cx-1+cos(rot)*3, cy-1+sin(rot)*3, 2,2, 2);                        // rotating terracotta marker (legible rotation)
    const c2x=cx+11,c2y=cy+6, R2=5;                                     // small meshed cog (opposite direction)
    for(let i=0;i<6;i++){ const a=-rot*1.25+i*Math.PI/3; r(c2x+cos(a)*R2-1, c2y+sin(a)*R2-1, 2,2, 5); }
    r(c2x-R2+2,c2y-R2+2,(R2-2)*2,(R2-2)*2,5); r(c2x-1,c2y-1,2,2,4);
    const wob=(osc(t,1.5)-0.5)*5;                                       // wrench tightening gently (osc)
    r(cx-15,cy-2+wob,9,3,4); r(cx-8,cy-3+wob,3,5,2); spec(cx-14,cy-1+wob); // wrench: handle + terracotta head
  };

  // ARCHITECT: reading the GLOBAL topology — on a gridded plan, two clusters (domains)
  //   que l'architecte RELIE par un pont terracotta en construction. Vue d'ensemble,
  //   distinct from the gardener's 'mapping' (treasure map).
  SCENES.architecting = (t)=>{ panel(54,32,34,28);                    // plan / blueprint
    for(let i=1;i<5;i++){ r(54,32+i*6,34,1,12); r(54+i*7,32,1,28,12); } // grille fine
    const A=[[60,40],[64,45],[58,47]], B=[[80,50],[83,44],[78,55]];   // deux amas (domaines)
    g.strokeStyle=PAL[5]; g.lineWidth=1;                              // internal links (grey)
    g.beginPath(); g.moveTo(A[0][0],A[0][1]); g.lineTo(A[1][0],A[1][1]); g.lineTo(A[2][0],A[2][1]);
    g.moveTo(B[0][0],B[0][1]); g.lineTo(B[1][0],B[1][1]); g.lineTo(B[2][0],B[2][1]); g.stroke();
    for(const n of A.concat(B)) r(n[0]-1,n[1]-1,2,2,5);               // nœuds gris
    const k=osc(t,3), ax=64,ay=45,bx=80,by=50;                       // a BRIDGE building and unbuilding gently (osc)
    for(let s=0;s<=k*9;s++){ const x=ax+(bx-ax)*s/9, y=ay+(by-ay)*s/9; r(x,y,1,1,2); }
    const hx=ax+(bx-ax)*k, hy=ay+(by-ay)*k;
    glow(hx,hy,5); r(hx-1,hy-1,3,3,2);                               // bridge head (active) + GLOW
    if(k>0.9){ glow(bx,by,7); r(bx-2,by-2,4,4,2); }                  // the target cluster LIGHTS UP once connected
    r(56,57,7,1,4); r(56,53,1,5,4); spec(56,53);                     // architect's set square
  };

  // the "step finished" overlay: the creature jumps + a ✓
  function drawCheck(w){
    const cx=78,cy=24,s=8+w*5; g.globalAlpha=Math.min(1,w*2);
    g.strokeStyle=PAL[2]; g.lineWidth=4; g.lineJoin='round'; g.beginPath();
    g.moveTo(cx-s*0.5,cy+s*0.05); g.lineTo(cx-s*0.1,cy+s*0.45); g.lineTo(cx+s*0.55,cy-s*0.5); g.stroke();
    g.globalAlpha=1;
  }

  // ── CODE BACKDROP: the REAL code of the active agent's script scrolls faintly behind the creature ──
  const CODE_SRC = { distilling:'agents/distillateur.md', gardening:'agents/jardinier.md', filing:'agents/jardinier.md',
    correcting:'agents/jardinier.md', mapping:'agents/jardinier.md', architecting:'agents/architecte.md',
    challenging:'agents/challenger.md', archiving:'agents/archiviste.md', synthesizing:'agents/synthetiseur.md',
    auditing:'hooks/brain_upkeep.py', committing:'hooks/auto_maintain.py' };
  let _codeCache={}, _codeLines=[];
  function loadCode(activity){                 // lit le VRAI fichier de l'agent (fs), met en cache
    const rel = CODE_SRC[activity];
    if(!rel){ _codeLines=[]; return; }
    if(_codeCache[rel]){ _codeLines=_codeCache[rel]; return; }
    try { const txt = fs.readFileSync(path.join(os.homedir(),'claude-brain',rel),'utf8');
      _codeLines = _codeCache[rel] = txt.split('\n').map(l=>l.replace(/\t/g,'  ')).filter(l=>l.trim().length>1).slice(0,500);
    } catch(e){ _codeLines=[]; }
  }
  function drawCodeBg(t, accent){              // faint scroll, in device space, behind the creature
    if(!_codeLines.length) return;
    g.save(); g.setTransform(1,0,0,1,0,0);
    const lh=Math.max(7,Math.floor(DEV.h/23)), fpx=lh-1;        // moderate size
    g.font=fpx+'px "Courier New", monospace'; g.textBaseline='top'; g.fillStyle=accent;
    const n=Math.ceil(DEV.h/lh)+1, scroll=(t*8)%_codeLines.length, s0=Math.floor(scroll), subY=-(scroll-s0)*lh;
    for(let i=0;i<n;i++){ const y=i*lh+subY;
      // DISCREET code: dimmed top and bottom AND in the CENTRE (behind the avatar) → hierarchy avatar > animation > code
      const yc=y/DEV.h, edge=1-Math.abs(yc-0.5)*1.1, mid=0.55+0.45*Math.abs(yc-0.42)*2.2;
      g.globalAlpha=Math.max(0, 0.17*edge*Math.min(1,mid));
      g.fillText((_codeLines[(s0+i)%_codeLines.length]||'').slice(0,56), 4, y);
    }
    g.globalAlpha=1; g.restore();
  }
  // P3a — respect de prefers-reduced-motion (a11y) : moins de FPS, pas de particules ni de scintillement.
  const REDUCE = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let _lt=0, _lastDraw=0, _prevA=null, _transAt=0;
  // WAKE AT THE INTENDED CADENCE, not the screen's.
  //   Before: requestAnimationFrame was scheduled at the top of render(), so the renderer woke
  //   at the display refresh rate (60/120 Hz) and bailed out immediately on the fps cap. We paid 120 wake-ups
  //   par seconde pour dessiner 14 images — sur un MacBook Air sans ventilateur c'est du pur gaspillage,
  //   and every wake-up forces WindowServer to recompose a transparent alwaysOnTop window.
  //   Now: setTimeout(intended delay) THEN rAF → one wake-up per frame actually drawn.
  function fpsNow(){
    if(REDUCE) return 8;
    return cur.state==='busy' ? 30 : 6;   // busy 120→30 (pixel art, the eye cannot tell), rest 14→6
  }
  function schedule(){
    const wait = Math.max(0, 1000/fpsNow() - (Date.now() - _lastDraw));
    setTimeout(() => requestAnimationFrame(render), wait);
  }
  function render(){
    const now=Date.now();
    if(document.hidden){ schedule(); return; }                      // pause when the window is not visible
    _lastDraw=now;
    schedule();                                                     // schedules the next one at the right cadence
    const t=(window.__forceT!=null?window.__forceT:now/1000), dt=Math.min(0.05,(now-_lt)/1000||0.016); _lt=now;  // __forceT: verification harnesstion
    const dpr=window.devicePixelRatio||1; if(dpr!==_dpr){ _dpr=dpr; setupCanvas(); }  // follows a move between displays
    cls(0);
    const a = cur.state==='busy' ? cur.activity : 'idle';
    if(a!==_prevA){ _transAt=now; _prevA=a; loadCode(a); }   // activity change → reload the backdrop code
    stage();                                    // environment (depth) under the scene
    if(cur.state==='busy') drawCodeBg(t, ACCENT[a]||ACCENT.idle); // the agent's REAL code, faint, behind the creature
    _expr = EXPR[a] || 'happy';                  // P2b : l'humeur suit l'agent actif
    // VERTICAL COMPOSITION: avatar CENTRED at the top · animation ALWAYS below.
    if(a==='idle'){
      SCENES.idle(t);                            // rest: the idle scene already draws the creature centred (x=50)
    } else {
      // the scene draws only its PROPS (creature suppressed through _compose) → we re-centre and shrink them into the
      //   lower band, then draw the centred creature watching its work below.
      _compose=true;
      g.save();
      g.translate(50,64); g.scale(0.88,0.88); g.translate(-70,-44);  // V21 : props agrandis (scale 0.76→0.88), centre (70,44) → (50,64)
      (SCENES[a] || SCENES.idle)(t);
      g.restore();
      _compose=false;
      critter(50, 26, 5, t, {looky:0.5, acc:ACC_OF[a]});  // avatar +1 (s=5), centred, WITH its role prop
    }
    stepDrawParts(dt);
    const left = celebrateUntil - now;
    if(left>0){ const inT=1500-left; let w=inT<280?inT/280:(left<360?left/360:1); drawCheck(Math.max(0,Math.min(1,w))); }
    // TRANSITION: a dark veil dissolving (240 ms) on every scene change → no more hard cut.
    const tr=now-_transAt;
    if(!REDUCE && tr<240){ const k=(1-tr/240)*0.6; g.save(); g.setTransform(1,0,0,1,0,0);
      g.fillStyle='rgba(18,16,15,'+k+')'; g.fillRect(0,0,DEV.w,DEV.h); g.restore(); }
  }
  setInterval(readStatus, 1000); readStatus(); render();   // 400→1000 ms; an agent does not change state 2.5×/s
</script>
