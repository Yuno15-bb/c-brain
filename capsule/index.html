<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<style>
  :root { --cyan:#5ad7e6; --green:#61e6a0; --red:#e0685e; --amber:#f2c94c; --claude:#c77b5a;
          --violet:#b78be6; --steel:#7aa6e0; --gold:#e0a85e; }
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
  html,body { background:transparent; overflow:hidden; font-family:"Courier New",monospace; }

  #capsule {
    width:188px; height:304px; padding:9px;
    display:flex; flex-direction:column; align-items:center; border-radius:18px;
    /* V22 — AU REPOS : PAS de backdrop-filter. Un blur de fond sur une fenêtre transparente
       alwaysOnTop force le GPU à re-flouter ce qu'il y a DERRIÈRE, en continu, au rythme du
       compositeur — totalement indépendant du cap fps du canvas. C'était le coût résiduel du
       helper GPU (~5 % d'un cœur en permanence). Au repos on sert un fond translucide simple :
       visuellement très proche, quasi gratuit. Le vrai verre revient en busy, quand tu regardes. */
    background:rgba(26,23,21,0.86);
    border:1px solid rgba(255,255,255,0.16);
    box-shadow:0 8px 30px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,0.12);
    -webkit-app-region:drag; position:relative; transition:box-shadow .3s, border-color .3s, background .3s;
  }
  body[data-state="busy"] #capsule {
    border-color:var(--led,var(--claude))aa; animation:halo 2.8s ease-in-out infinite;
    background:rgba(26,23,21,0.55);
    -webkit-backdrop-filter:blur(12px) saturate(1.1); backdrop-filter:blur(12px) saturate(1.1);  /* V22 : 18→12 px */
  }

  #btns { position:absolute; top:6px; right:7px; display:flex; gap:4px; opacity:0; transition:opacity .15s; -webkit-app-region:no-drag; z-index:6; }
  #capsule:hover #btns { opacity:1; }
  .btn { width:13px; height:13px; font-size:10px; line-height:12px; text-align:center; cursor:pointer; color:#1a1410; font-weight:bold; border-radius:2px; }
  #reduce { background:var(--amber); } #reduce:hover{ background:#ffe07a; }
  #del { background:var(--red); color:#fff; } #del:hover{ background:#ff8478; }

  #dot { position:absolute; top:8px; left:9px; width:6px; height:6px; background:#3a302a; border-radius:1px; }
  body[data-state="busy"] #dot { background:var(--led,var(--claude)); animation:ledpulse 1.5s ease-in-out infinite; }

  #screen { position:relative; width:160px; height:150px; margin-top:8px;
    background:rgba(18,16,15,0.45); border:3px solid rgba(12,11,10,0.7); border-radius:9px; overflow:hidden;
    box-shadow:inset 0 0 0 2px #2a2622; }
  #scr { position:absolute; inset:0; width:100%; height:100%; image-rendering:pixelated; }
  #crt { position:absolute; inset:0; pointer-events:none;
    background:
      radial-gradient(circle at 50% 44%, transparent 62%, rgba(0,0,0,.30)),
      repeating-linear-gradient(0deg, rgba(0,0,0,.08) 0 1px, transparent 1px 3px);
    mix-blend-mode:multiply; opacity:.42; }

  /* ── LABEL : l'activité en cours (verbe) ─────────────────────── */
  #label { margin-top:8px; color:var(--led,var(--claude)); font-size:15px; font-weight:bold;
    letter-spacing:2px; text-transform:uppercase; height:18px; width:100%; text-align:center;
    text-shadow:0 0 10px var(--led,var(--claude)); }
  body[data-state="idle"] #label { color:#c99b7e; text-shadow:0 0 6px rgba(201,155,126,.35); } /* P1 : label idle lisible + chaud (écho de la mascotte) */

  /* ── DETAIL : ligne « live » façon terminal (point pulsant + texte) ── */
  #detail { margin-top:4px; height:12px; width:152px; display:flex; align-items:center;
    justify-content:center; gap:5px; opacity:0; transition:opacity .35s; }
  body[data-state="busy"] #detail { opacity:1; }
  body[data-state="idle"][data-last="1"] #detail { opacity:.5; }   /* idle : rappel « dernier agent · il y a X » */
  #detail .dot { width:4px; height:4px; border-radius:50%; flex:0 0 auto;
    background:var(--led,var(--claude)); box-shadow:0 0 5px var(--led,var(--claude));
    animation:ledpulse 1.3s ease-in-out infinite; }
  body[data-state="idle"] #detail .dot { animation:none; box-shadow:none; opacity:.7; }  /* statique en idle */
  #detail .txt { color:#cbbdac; opacity:.85; font-size:7.5px; letter-spacing:.5px;
    text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:132px; }

  /* ── PROGRESS : pipeline DISTILL → ORGANIZE → SAVE, segments en relief ── */
  #progress { position:relative; margin-top:11px; width:154px; height:6px; display:flex; gap:5px; opacity:0; transition:opacity .35s; }
  body[data-state="busy"] #progress { opacity:1; }
  .seg { flex:1; height:100%; border-radius:99px; position:relative; overflow:hidden;
    background:rgba(0,0,0,0.30); transition:opacity .3s;
    box-shadow:inset 0 1px 1.5px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(255,255,255,0.05); }

  /* mode INDÉTERMINÉ : agents sans pipeline 3-phases (challenger, archiviste, synthé, architecte, mécanicien)
     → on masque les segments/labels et on montre une barre d'activité à pulse glissant (honnête : pas de fausse phase). */
  #indet { position:absolute; inset:0; display:none; border-radius:99px; overflow:hidden;
    background:rgba(0,0,0,0.30); box-shadow:inset 0 1px 1.5px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(255,255,255,0.05); }
  #indet span { position:absolute; top:0; bottom:0; left:-42%; width:42%; border-radius:99px;
    background:linear-gradient(90deg, transparent 0%, var(--led,var(--claude)) 50%, transparent 100%);
    box-shadow:0 0 8px var(--led,var(--claude)); animation:indet 1.4s ease-in-out infinite; }
  body[data-prog="indet"] .seg { opacity:0; }
  body[data-prog="indet"] #indet { display:block; }
  body[data-prog="indet"] #steplabels span { visibility:hidden; }  /* garde la hauteur → pas de saut de layout */
  .seg .fill { position:absolute; inset:0; width:0%; border-radius:99px;
    background:linear-gradient(180deg,
      color-mix(in srgb, var(--led,var(--claude)) 68%, #fff) 0%,
      var(--led,var(--claude)) 50%,
      color-mix(in srgb, var(--led,var(--claude)) 82%, #000) 100%);
    transition:width .5s cubic-bezier(.4,0,.2,1); }
  .seg.done .fill   { width:100%; box-shadow:0 0 7px var(--led,var(--claude)), inset 0 1px 0 rgba(255,255,255,0.4); }
  .seg.active .fill { width:100%; box-shadow:0 0 9px var(--led,var(--claude)), inset 0 1px 0 rgba(255,255,255,0.45); }
  .seg.active .fill::after { content:''; position:absolute; inset:0; border-radius:99px;
    background:linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.55) 50%, transparent 100%);
    background-size:230% 100%; animation:slide 1.25s linear infinite; }

  /* ── STEP LABELS : alignés sous chaque segment, états past/on/pending ── */
  #steplabels { width:154px; margin-top:6px; display:flex; gap:5px; opacity:0; transition:opacity .35s; }
  body[data-state="busy"] #steplabels { opacity:1; }
  #steplabels span { flex:1; text-align:center; font-size:6.5px; font-weight:bold; letter-spacing:.7px;
    color:#766a60; transition:color .35s, text-shadow .35s; }
  #steplabels span.past { color:#b49a86; }
  #steplabels span.on   { color:var(--led,var(--claude)); text-shadow:0 0 6px var(--led,var(--claude)); }

  /* ── ROLE : carte d'identité de l'agent (qui + son rôle) ─────── */
  #role { margin-top:11px; width:158px; padding-top:9px; text-align:center; position:relative;
    border-top:1px solid rgba(255,255,255,0.09); }
  #role::before { content:''; position:absolute; top:-1px; left:50%; transform:translateX(-50%);
    width:34px; height:1px; background:var(--led,var(--claude)); box-shadow:0 0 6px var(--led,var(--claude)); opacity:.75; }
  body[data-state="idle"] #role::before { background:#9a8d80; box-shadow:none; opacity:.4; }
  #role .who { color:var(--led,var(--claude)); font-size:8.5px; font-weight:bold; letter-spacing:1.2px;
    text-transform:uppercase; text-shadow:0 0 7px var(--led,var(--claude)); }
  body[data-state="idle"] #role .who { color:#9a8d80; text-shadow:none; }
  #role .what { margin-top:4px; color:#bcae9e; opacity:.8; font-size:7.5px; letter-spacing:.2px;
    line-height:1.4; }

  @keyframes ledpulse { 0%,100%{ opacity:1; box-shadow:0 0 6px var(--led,var(--claude)); } 50%{ opacity:.5; box-shadow:0 0 13px var(--led,var(--claude)); } }
  @keyframes halo { 0%,100%{ box-shadow:0 8px 30px rgba(0,0,0,.42), 0 0 14px var(--led,var(--claude))40, inset 0 1px 0 rgba(255,255,255,0.18); }
    50%{ box-shadow:0 8px 32px rgba(0,0,0,.46), 0 0 30px var(--led,var(--claude))99, inset 0 1px 0 rgba(255,255,255,0.24); } }
  @keyframes slide { from{ background-position:220% 0 } to{ background-position:-220% 0 } }
  @keyframes indet { 0%{ left:-42% } 100%{ left:100% } }

  /* ── MODE LIBRE (CAPSULE_SOLO=1) — la créature seule, posée sur le Dock ────
     Premier test de compagnon de bureau : on ne supprime RIEN, on neutralise.
     La capsule complète reste le mode par défaut, à un drapeau près — un
     prototype ne se paie pas en démontant ce qui marche. */
  body[data-solo="1"] #capsule{
    /* ⚠ La fenêtre est plus haute que le dessin (elle réserve la course de la
       vague). #screen se cale sur son BAS — encore faut-il que le conteneur
       ait une hauteur. En `height:auto` avec des enfants absolus, #capsule
       s'effondrait à zéro et le dessin remontait tout en haut : personnage
       invisible, aucune erreur. */
    position:absolute; inset:0;
    width:auto; height:auto; padding:0; background:none; border:none;
    box-shadow:none; border-radius:0; backdrop-filter:none; -webkit-backdrop-filter:none;
    animation:none;
  }
  /* le halo « busy » repeignait une plaque : il est neutralisé aussi, sinon
     la créature retrouve un cadre dès qu'un agent démarre. */
  body[data-solo="1"][data-state="busy"] #capsule{
    background:none; border-color:transparent; animation:none;
    backdrop-filter:none; -webkit-backdrop-filter:none;
  }
  /* l'écran CRT est un MEUBLE : cadre, fond, coins, scanlines. Tout part. */
  body[data-solo="1"] #screen{
    margin:0; background:none; border:none; border-radius:0; box-shadow:none;
    /* La fenêtre du mode libre est HAUTE (120 × 208) : elle réserve au-dessus
       du dessin la course que le compagnon parcourt quand la vague du Dock
       passe. Le dessin, lui, tient dans 120×112 collés EN BAS.
       C'est cette couche-là qu'on décale — jamais la fenêtre. */
    /* `bottom:40px` = la réserve laissée SOUS la ligne de sol pour les jambes
       qui pendent en position assise (SOLO_ASSIS dans main.js). Debout, le
       dessin est au-dessus ; assis, il descend dedans. */
    position:absolute; left:0; bottom:34px; width:120px; height:112px;
    /* translateZ force une couche à part : le compositeur n'a plus qu'à la
       déplacer, sans redessiner ce qu'il y a autour. */
    will-change:transform; transform:translate3d(0,0,0);
  }
  /* ── L'OMBRE RESTE AU SOL ─────────────────────────────────────────────────
     Elle fait partie du personnage dans le fichier Lottie : elle montait donc
     AVEC lui pendant le saut. Une ombre qui vole annule le saut — c'est elle
     qui dit où est le sol. On l'efface le temps du vol ; elle revient à la
     réception, là où il touche vraiment.
     (`OMBRE_SOL` est posé par states.py : lottie-web n'écrit un `id` dans le
      DOM que s'il trouve un champ `ln`, il ne recopie jamais `nm`.)

     ⚠ `!important` OBLIGATOIRE. Lottie réécrit l'opacité de ses calques en
     style INLINE à chaque image. Une règle CSS ordinaire l'emporte sur un
     attribut de présentation — mais JAMAIS sur du inline. Sans `!important`
     la règle est correcte, appliquée… et sans aucun effet visible. */
  body[data-solo="1"][data-vol="1"] #avatar #OMBRE_SOL{ opacity:0 !important; }
  body[data-solo="1"] #crt{ display:none; }
  /* tout le texte et l'instrumentation autour : ce sont des informations de
     panneau, pas le personnage. Elles reviendront au survol ou au clic. */
  body[data-solo="1"] #label,
  body[data-solo="1"] #detail,
  body[data-solo="1"] #progress,
  body[data-solo="1"] #steplabels,
  body[data-solo="1"] #role,
  body[data-solo="1"] #btns,
  body[data-solo="1"] #dot{ display:none; }


  /* ── LE PERSONNAGE (mode libre) ────────────────────────────────────────────
     Un Lottie vectoriel dérivé de « Love is blind » remplace la créature
     pixel dessinée au canvas. Il ne sort QUE en mode libre : dans la boîte,
     la V1 garde sa créature — un prototype ne démonte pas ce qui marche.
     UNE seule identité désormais : le rectangle. C'est la COULEUR qui dit
     l'état, et elle se déplace progressivement — le personnage ne disparaît
     jamais. Un seul fichier au lieu de treize (11 Mo → 0,8 Mo).
     Recadrage MESURÉ sur les 58 images : x 778→1559, y 485→1510.
     ⚠ À REMESURER dès que les bras bougent : ce sont eux qui fixent la
     largeur, pas le corps.
     ⚠ En CSS les transformations se lisent de DROITE à GAUCHE : le translate
     agit en unités Lottie, AVANT la mise à l'échelle. */
  #avatar{ display:none; position:absolute; inset:0; }
  /* DEUX animations superposées : la marche et le repos. On FOND de l'une à
     l'autre — le personnage n'est jamais absent, même une image.
     Pourquoi deux fichiers et pas deux plages du même : Lottie n'honore que
     les images clés d'ORIGINE d'une propriété ; celles qu'on ajoute derrière
     sont écrites, vérifiables, et jamais jouées. Vérifié par expérience. */
  /* ⚠ PAS DE `transition:opacity` ICI — c'était le défaut P0 (audit du
     2026-07-31, reproduit au harnais sur le vrai code) : un fondu de 320 ms
     entre DEUX RIGS dont les poses ne correspondent pas montre, à mi-course,
     deux corps, deux paires de jambes et deux ombres. Vu à 81 ms.

     La contrainte « le personnage ne doit jamais être absent » avait été lue
     comme « les deux doivent être visibles ensemble ». C'est le mauvais
     invariant. Le bon : UNE SILHOUETTE LISIBLE À CHAQUE IMAGE. L'échange est
     donc instantané, et c'est la CHORÉGRAPHIE ci-dessous qui le masque — on
     échange au moment où le corps est le plus compact, là où l'œil ne lit
     plus le détail des membres. */
  /* ⚠ IL REGARDE À DROITE (demande de l'auteur, 2026-07-31). Le fichier d'origine
     le fait marcher vers la GAUCHE ; on le retourne par le recadrage lui-même,
     pas par une transformation ajoutée — celle-ci écraserait le recadrage, ou
     mangerait le seul emplacement libre qui sert au pont.
     Le miroir se fait autour du MILIEU DE LA SILHOUETTE, sinon il sort du
     cadre. Silhouette mesurée : x 778→1559, donc milieu 1168,5 ;
     la translation passe de -759 à -(2×1168,5 − 759) = -1578.
     Vérification : x_écran = (1578 − x_lottie) × .1054 → 778 donne 84,3 et
     1559 donne 2,0. Même emprise qu'avant, retournée. */
  /* ⚠ IL REGARDE À GAUCHE — et c'est le sens D'ORIGINE du fichier.
     Il avait été retourné (scaleX(-1)) pour le design « assis au bord du Dock,
     tourné vers le coin ». Depuis qu'il vit DANS le coin, dos à la limite de
     l'écran, il regarde vers l'intérieur du bureau : le miroir n'a plus lieu
     d'être et on revient au recadrage nu. Une transformation en moins, un
     piège en moins. */
  #avatar>div{ position:absolute; width:1920px; height:1920px;
               transform-origin:0 0;
               transform:scale(.1054) translate(-759px,-466px);
               opacity:0; }
  /* Le retournement reste disponible si une famille de comportements en a
     besoin. Le miroir change AUSSI la translation (bascule autour du milieu de
     silhouette 1168,5, pas autour de l'origine) : d'où deux transformations
     écrites en toutes lettres plutôt qu'un facteur variable. */
  body[data-sens="droite"] #avatar>div{
    transform:scale(.1054) scaleX(-1) translate(-1578px,-466px); }
  #avatar>div.vu{ opacity:1; }

  /* ── LE PONT repos ⇄ marche ────────────────────────────────────────────────
     Anticipation → compression → échange → détente → follow-through.
     ⚠ Il s'applique à #avatar, PAS à #avatar>div : ce dernier porte déjà le
     recadrage, et une animation CSS sur `transform` ÉCRASE le `transform` posé
     sur le MÊME élément — c'est le piège qui avait envoyé le personnage à
     1920 px hors cadre. #avatar est le seul emplacement de transformation
     encore libre : le SVG porte la respiration, #screen porte la vague. */
  @keyframes bascule {
    0%   { transform:translateY(0)      scaleY(1)    scaleX(1);    }
    18%  { transform:translateY(2.5px)  scaleY(.995) scaleX(1.004); }  /* anticipation : il se ramasse */
    38%  { transform:translateY(3px)    scaleY(.97)  scaleX(1.015); }  /* compression — L'ÉCHANGE A LIEU ICI */
    80%  { transform:translateY(-1.5px) scaleY(1.008) scaleX(.996); }  /* détente, léger dépassement */
    100% { transform:translateY(0)      scaleY(1)    scaleX(1);    }
  }
  body[data-solo="1"] #avatar.bascule{
    animation:bascule 500ms cubic-bezier(.34,.06,.2,1);
    transform-origin:50% 98%;   /* le poids passe par les pieds, pas par le centre */
  }
  @media (prefers-reduced-motion: reduce){
    /* mouvement réduit : une COUPE nette sur une pose stable, jamais de pont. */
    body[data-solo="1"] #avatar.bascule{ animation:none; }
  }
  body[data-solo="1"] #avatar{ display:block; }
  /* P0 — LE REPOS NE DOIT RIEN COÛTER. Mesuré : la même image, repeinte 24
     fois par seconde par Lottie, coûtait 17 % de processeur. Or au repos seule
     la RESPIRATION bouge. On met donc l'animation en PAUSE sur une image fixe
     et on respire en CSS : le compositeur déforme une couche déjà rendue, sans
     réveiller le processus. */
  @keyframes respire { 0%,100%{ transform:scaleY(1) } 50%{ transform:scaleY(.982) scaleX(1.009) } }
  /* ⚠ La respiration s'applique au SVG, PAS au div. Le div porte déjà un
     `transform` — le recadrage — et une animation CSS sur `transform`
     l'ÉCRASE : le personnage était rendu à 1920 px, hors cadre, et on le
     croyait disparu. Deux transformations sur le même élément, l'une gagne. */
  /* ⚠ LA RESPIRATION EN CONTINU COÛTE 12 % DE PROCESSEUR. Mesuré : un repos
     totalement figé tient à 0,4 % ; la même image avec une respiration CSS
     permanente monte à 12 %, parce qu'animer une transformation sur une
     fenêtre transparente toujours-au-dessus fait recomposer tout l'écran à
     chaque image. `will-change` n'y change rien.
     On souffle donc par INTERMITTENCE — 2,4 s toutes les 20 s, déclenché en
     JS. Amorti, ça revient à ~1,4 % pour un signe de vie qui suffit
     largement : personne ne regarde un compagnon respirer en continu. */
  body[data-solo="1"][data-allure="repos"] #avatar>div.vu>svg.souffle{
    animation:respire 2.4s ease-in-out;
    transform-origin:50% 92%;
  }
  body[data-solo="1"][data-allure="repos"] #avatar>div.vu>svg{
    animation:none;
    /* promouvoir en couche propre : sans ça, chaque image de la respiration
       fait recomposer toute la fenêtre transparente, et le repos coûte autant
       qu'une animation complète. */
    will-change:transform;
    transform-origin:50% 92%;   /* le poids repose en bas : on s'écrase vers les pieds */
  }
  @media (prefers-reduced-motion: reduce){
    /* ⚠ LA RESPIRATION EN CONTINU COÛTE 12 % DE PROCESSEUR. Mesuré : un repos
     totalement figé tient à 0,4 % ; la même image avec une respiration CSS
     permanente monte à 12 %, parce qu'animer une transformation sur une
     fenêtre transparente toujours-au-dessus fait recomposer tout l'écran à
     chaque image. `will-change` n'y change rien.
     On souffle donc par INTERMITTENCE — 2,4 s toutes les 20 s, déclenché en
     JS. Amorti, ça revient à ~1,4 % pour un signe de vie qui suffit
     largement : personne ne regarde un compagnon respirer en continu. */
  body[data-solo="1"][data-allure="repos"] #avatar>div.vu>svg.souffle{
    animation:respire 2.4s ease-in-out;
    transform-origin:50% 92%;
  }
  body[data-solo="1"][data-allure="repos"] #avatar>div.vu>svg{ animation:none }
  }
  body[data-solo="1"] #scr{ display:none; }

  /* ── LA PASTILLE (mode libre) ─────────────────────────────────────────────
     Le nom de l'agent, au-dessus du compagnon. Elle n'est PAS permanente : un
     libellé toujours affiché devient du mobilier et cesse d'être lu au bout de
     deux jours. Elle sort quand l'activité CHANGE — le seul moment où on a
     besoin de la lire — puis s'efface, et revient au survol.
     La couleur seule ne peut pas porter treize agents : on en retient trois ou
     quatre, pas treize. */
  /* ⚠ `bottom` MESURÉ, pas choisi : à 112 px l'étiquette coupait le haut du
     crâne et couvrait les lunettes (audit du 2026-07-31, vu à 188 ms). Elle
     ne doit jamais servir à cacher le raccord d'animation — c'est le pont qui
     s'en charge. Remontée au-dessus de la silhouette, vérifiée en capture. */
  /* MESURÉ, pas choisi. À 112 px elle coupait le crâne ; à 152 elle mordait
     encore de 18 pt — vérifié sur fond uni dans les DEUX poses (assis : haut du
     crâne 155, bas de pastille 173 · debout : 169 et 188). Les deux poses
     partagent la même translation, donc une seule constante les règle.
     180 px laisse ~9 pt de jour au-dessus de la tête dans les deux cas. */
  #dit{ display:none; position:absolute; left:50%; bottom:180px;
        padding:2px 7px; border-radius:6px; white-space:nowrap;
        background:rgba(18,21,27,.94); color:#fff;
        font:600 9px/1.4 ui-sans-serif,-apple-system,sans-serif; letter-spacing:.5px;
        box-shadow:0 2px 8px rgba(0,0,0,.5);
        opacity:0; transition:opacity .28s ease; pointer-events:none;
        transform:translate(-50%,0); }
  /* ⚠ PAS `left:50%` en mode libre. Depuis que la fenêtre couvre les DEUX
     places (assise sur le Dock, debout dans le coin), sa moitié n'est plus le
     milieu du personnage : l'étiquette partait se coller au bord droit et se
     faisait couper par l'écran. On vise le MILIEU DU CORPS dans sa case —
     43 pt, déduit du recadrage (silhouette 2→84,3) — et le bond la déplace
     ensuite avec lui. */
  body[data-solo="1"] #dit{ display:block; left:43px; }
  #dit.vu{ opacity:1; }
  /* le petit bec, pour que la pastille désigne le compagnon */
  #dit::after{ content:''; position:absolute; left:50%; top:100%;
        margin-left:-4px; border:4px solid transparent;
        border-top-color:rgba(18,21,27,.94); }
</style>
</head>
<body data-state="idle" data-activity="idle" data-source="you">
  <div id="capsule">
    <div id="dot"></div>
    <div id="btns"><div id="reduce" class="btn" title="Réduire (⌘⇧B)">_</div><div id="del" class="btn" title="Fermer">x</div></div>
    <div id="screen"><canvas id="scr"></canvas><div id="avatar"><div></div><div></div></div><div id="crt"></div></div>
    <div id="dit"></div>
    <div id="label">IDLE</div>
    <div id="detail"><span class="dot"></span><span class="txt"></span></div>
    <div id="progress"><div class="seg"><span class="fill"></span></div><div class="seg"><span class="fill"></span></div><div class="seg"><span class="fill"></span></div><div id="indet"><span></span></div></div>
    <div id="steplabels"><span>DISTILL</span><span>ORGANIZE</span><span>SAVE</span></div>
    <div id="role"><div class="who"></div><div class="what"></div></div>
  </div>

<script>
  const nodeRequire = window.require;
  const fs = nodeRequire('fs'); const os = nodeRequire('os'); const path = nodeRequire('path');
  const { ipcRenderer } = nodeRequire('electron');
  const STATUS = path.join(os.homedir(), '.c-brain', 'trunk', 'state', 'status.json');
  document.getElementById('reduce').onclick = () => ipcRenderer.send('cap-hide');
  document.getElementById('del').onclick    = () => ipcRenderer.send('cap-quit');

  /* ===================== ÉTAT PARTAGÉ ===================== */
  const body=document.body, elLabel=document.getElementById('label');
  const elDetailTxt=document.querySelector('#detail .txt');
  let cur={state:'idle',activity:'idle',source:'you',detail:''};
  let lastBusy=0, hiddenByIdle=false;
  const MAP = { idle:'IDLE', distilling:'DISTILLING', filing:'FILING', correcting:'CORRECTING',
    mapping:'MAPPING', gardening:'ORGANIZING', committing:'SAVING', challenging:'CHALLENGING',
    archiving:'ARCHIVING', synthesizing:'SYNTHESIZING', auditing:'AUDITING', architecting:'ARCHITECTING' };
  const PHASE_OF = { distilling:0, gardening:1, filing:1, correcting:1, mapping:1, challenging:1, archiving:1, synthesizing:1, architecting:1, committing:2 };
  // Couleur SIGNATURE par agent → on identifie qui travaille d'un coup d'œil (le canal couleur servait à rien avant).
  const ACCENT = { idle:'#d59570',    // P1 : terracotta « reposé » → la mascotte est vivante au repos (plus de gris terne)
    distilling:'#c77b5a',                                                   // distillateur — terracotta
    gardening:'#61e6a0', filing:'#61e6a0', correcting:'#61e6a0', mapping:'#61e6a0', // jardinier — UN seul vert : même agent = même couleur (la SCÈNE différencie la sous-tâche)
    architecting:'#5ad7e6',                                                 // architecte — cyan
    challenging:'#e0685e',                                                  // challenger — rouge
    archiving:'#f2c94c',                                                    // archiviste — ambre
    synthesizing:'#b78be6',                                                 // synthétiseur — violet
    auditing:'#7aa6e0',                                                     // mécanicien — bleu acier
    committing:'#e0a85e' };                                                 // sauvegarde git — or
  // P2b — EXPRESSION par caractère d'agent (lue par critter via _expr) : la créature n'est plus seulement
  //        colorée, elle est EXPRESSIVE. focus=concentré · wide=alerte · sleepy=paupières lourdes · skeptical=œil plissé · sparkle=pétillant.
  const EXPR = { idle:'happy', distilling:'focus', gardening:'happy', filing:'happy',
    correcting:'focus', mapping:'wide', architecting:'wide', challenging:'skeptical',
    archiving:'sleepy', synthesizing:'sparkle', auditing:'focus', committing:'happy' };
  // V21 — ACCESSOIRE de rôle par activité (repassé à l'avatar CENTRÉ, depuis que la scène ne dessine plus la créature).
  const ACC_OF = { distilling:'chem', gardening:'flower', filing:'flower', correcting:'flower', mapping:'flower',
    challenging:'monocle', archiving:'glasses', synthesizing:'nodes', auditing:'cap', architecting:'hardhat' }; // committing/idle : aucun
  // Rôle de chaque activité DANS L'ARCHITECTURE — texte précis affiché en bas (idle inclus).
  const ROLE = {
    idle:        ['LES 8 AGENTS',     'au repos · le tronc veille'],   // P1 : condensé (plus de mur de 7 px)
    distilling:  ['DISTILLATEUR',     'extrait de la session finie les fiches & leçons durables'],
    gardening:   ['JARDINIER',        'range, déduplique, tisse les liens [[ ]], masque les secrets'],
    filing:      ['JARDINIER',        'classe chaque fiche dans la bonne section de MEMORY.md'],
    correcting:  ['JARDINIER',        'corrige et affine le contenu d’une fiche'],
    mapping:     ['JARDINIER',        'cartographie : relie les fiches dans l’index du tronc'],
    architecting:['ARCHITECTE',       'cohésion globale : tisse les ponts inter-domaines, repère les îlots'],
    committing:  ['SAUVEGARDE git',   'versionne la croissance du tronc (couche lossless)'],
    challenging: ['CHALLENGER',       'met le savoir à l’épreuve : périmé, faux, contredit, survendu'],
    archiving:   ['ARCHIVISTE',       'élague le poids mort — propose, ne supprime jamais'],
    synthesizing:['SYNTHÉTISEUR','relie un thème transverse à travers plusieurs projets'],
    auditing:    ['MÉCANICIEN',  'audite & répare la machine : hooks, câblage, agents, capsule'],
  };
  const elRoleWho=document.querySelector('#role .who'), elRoleWhat=document.querySelector('#role .what');
  const SEGS = [...document.querySelectorAll('#progress .seg')];
  const STEPL = [...document.querySelectorAll('#steplabels span')];
  let celebrateUntil = 0;
  let _expr = 'happy';   // P2b : expression courante de la créature (posée par render() selon l'agent actif)
  let _compose = false;  // V19 : pendant le rendu d'une scène, on SUPPRIME la créature dessinée par la scène
                         //   (les scènes ne dessinent que leurs props) → la créature est dessinée CENTRÉE à part.
  function celebrate(){ celebrateUntil = Date.now() + 1500; if(!REDUCE) burst(50,34); } // P3a : pas de particules en reduced-motion
  // Agents sans vrai pipeline 3-phases → barre d'activité indéterminée (pas une fausse phase ORGANIZE figée).
  const INDET = new Set(['challenging','archiving','synthesizing','architecting','auditing']);
  function renderProgress(busy, activity){
    if(!busy){ body.dataset.prog='off'; SEGS.forEach(s=>s.className='seg'); STEPL.forEach(s=>s.className=''); return; }
    if(INDET.has(activity)){ body.dataset.prog='indet'; SEGS.forEach(s=>s.className='seg'); STEPL.forEach(s=>s.className=''); return; }
    body.dataset.prog='phase';
    const ph=(activity in PHASE_OF)?PHASE_OF[activity]:1;
    SEGS.forEach((s,i)=>{ s.className='seg '+(i<ph?'done':i===ph?'active':'pending'); });
    STEPL.forEach((s,i)=>{ s.className=(i<ph)?'past':(i===ph)?'on':''; });
  }
  let lastPhase=-1, wasBusy=false, faceCur=0;
  let lastSeenAct=null, lastSeenTs=0;   // mémoire courte : dernière activité vue (pour l'écran idle)
  const ago = s => s<60 ? "À L'INSTANT" : s<3600 ? 'IL Y A '+Math.floor(s/60)+' MIN' : 'IL Y A '+Math.floor(s/3600)+' H';
  function trackSteps(busy, activity){
    const indet = busy && INDET.has(activity);
    const ph=busy?((activity in PHASE_OF)?PHASE_OF[activity]:1):-1;
    // ne célèbre que la VRAIE progression du pipeline (pas l'entrée d'un agent indéterminé)
    if(busy && !indet && lastPhase>=0 && ph>lastPhase) celebrate();
    else if(!busy && wasBusy) celebrate();
    lastPhase=ph; wasBusy=busy;
  }
  function readStatus(){
    fs.readFile(STATUS,'utf8',(err,data)=>{
      let st={state:'idle'}; if(!err){ try{ st=JSON.parse(data);}catch(e){} }
      const now=Date.now()/1000; let state=st.state||'idle';
      // fenêtre de heartbeat (30 s) : auto_maintain rafraîchit ts toutes les 5 s pendant les longues
      // passes d'agent (heartbeat) → la capsule ne clignote plus en idle au milieu du travail ; 30 s = filet si un tick saute.
      if(state==='busy' && (now-(st.ts||0))>30) state='idle';
      cur={ state, activity: state==='busy'?(st.activity||'gardening'):'idle', source:st.source||'you', detail:st.detail||'' };
      if(state==='busy'){ lastSeenAct=cur.activity; lastSeenTs=now; }   // mémorise pour l'écran idle
      body.dataset.state=state; body.dataset.activity=cur.activity; body.dataset.source=cur.source;
      const accent = ACCENT[cur.activity]||ACCENT.idle;
      body.style.setProperty('--led', accent);
      applyBodyTint(accent);   // recolore la créature selon l'agent courant
      elLabel.textContent = state==='busy' ? MAP[cur.activity]||'WORKING' : 'IDLE';
      const role = ROLE[cur.activity] || ROLE.idle;
      // detail : en busy = signal live (préfixe « AGENT — » retiré pour ne pas doubler la carte) ;
      //          en idle = mémoire courte « <agent> · il y a X » (remplit l'espace mort utilement)
      let det = '';
      if(state==='busy'){
        det = cur.detail||'';
        if(det && role[0]){
          const who = role[0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
          det = det.replace(new RegExp('^\\s*'+who+'\\s*[—–-]\\s*','i'),'');
        }
      } else if(lastSeenAct){
        det = ((ROLE[lastSeenAct]||['',''])[0])+' · '+ago(now-lastSeenTs);
      }
      body.dataset.last = (state!=='busy' && lastSeenAct) ? '1' : '0';
      elDetailTxt.textContent = det;
      elRoleWho.textContent = role[0]; elRoleWhat.textContent = role[1];
      renderProgress(state==='busy', cur.activity);
      trackSteps(state==='busy', cur.activity);
      if(state==='busy'){ lastBusy=now; ipcRenderer.send('cap-show'); hiddenByIdle=false; }
      /* ⚠ EN MODE LIBRE, IL NE DISPARAÎT JAMAIS.
         L'effacement automatique vient du mode PANNEAU : un HUD qui n'affiche
         plus rien occupe l'écran pour rien, donc il s'efface. Le compagnon,
         lui, n'est pas un panneau — c'est un habitant du bureau. Le voir assis
         sur le Dock EST l'information « le Brain est vivant, rien ne tourne ».
         Le délai avait déjà été repoussé de 12 à 45 s pour cette raison ;
         c'était traiter le symptôme. À 45 s il s'évaporait après chaque passe
         d'agent et l'utilisateur se retrouvait devant un Dock vide sans savoir si la
         capsule avait planté.
         ⌘⇧B le cache toujours à la demande — c'est une DÉCISION, pas un
         minuteur. */
      else if(!SOLO && !hiddenByIdle && lastBusy && (now-lastBusy)>12){ ipcRenderer.send('cap-hide'); hiddenByIdle=true; }
    });
  }

  /* ===================== MOTEUR PIXEL — créature Claude Code ===================== */
  // palette : 0 fond, 1 terracotta ombre, 2 terracotta, 3 terracotta clair, 4 noir,
  //           5 gris prop, 6 gris clair, 7 verre clair, 8 bleu/LED, 9 blanc
  const PAL = ['#161412','#9c5638','#c77b5a','#e0a585','#0c0b0a','#9a9082','#dcd3c3','#cfe6e6','#79b58a','#f3ece2','#4a463f','#857f74','#c6bfb0',
               '#4a463f','#857f74','#c6bfb0'];  // P1 : props (5 corps,6 face,11 grain,12 highlight) relevés → l'action sort du noir
  // 10/11/12 = gris fixes (props, accessoires, grain). 13/14/15 = corps de la créature (ombre/corps/rim),
  //            RE-TEINTÉS dynamiquement selon la couleur de l'agent (cf. applyBodyTint).
  // outils couleur : recolore la créature à partir de l'accent de l'agent courant
  const _hx = h => { h=h.replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; };
  const _hex = (r,g,b) => '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
  const _mix = (a,b,t) => { const A=_hx(a),B=_hx(b); return _hex(A[0]+(B[0]-A[0])*t, A[1]+(B[1]-A[1])*t, A[2]+(B[2]-A[2])*t); };
  // HSL pour rampe HUE-SHIFTÉE (standard /pixel) : la teinte tourne le long de la rampe au lieu
  // de mixer vers noir/blanc (qui donne une rampe boueuse). Ombre = plus froide+désaturée (teinte −),
  // lumière = plus chaude+saturée (teinte +).
  const _r2hsl = hex => { let [r,g,b]=_hx(hex).map(v=>v/255); const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;
    let h=0,s=0,l=(mx+mn)/2; if(d){ s=l>0.5?d/(2-mx-mn):d/(mx+mn);
      h = mx===r ? (g-b)/d+(g<b?6:0) : mx===g ? (b-r)/d+2 : (r-g)/d+4; h*=60; } return [h,s,l]; };
  const _hsl2hex = (h,s,l)=>{ h=((h%360)+360)%360; s=Math.max(0,Math.min(1,s)); l=Math.max(0,Math.min(1,l));
    const c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h/60)%2-1)), m=l-c/2; let r,g,b;
    if(h<60)[r,g,b]=[c,x,0]; else if(h<120)[r,g,b]=[x,c,0]; else if(h<180)[r,g,b]=[0,c,x];
    else if(h<240)[r,g,b]=[0,x,c]; else if(h<300)[r,g,b]=[x,0,c]; else [r,g,b]=[c,0,x];
    return _hex((r+m)*255,(g+m)*255,(b+m)*255); };
  let _lastTint=null;
  function applyBodyTint(accent){
    if(accent===_lastTint) return;  // ne recalcule que si la couleur change
    _lastTint=accent;
    const [h,s,l]=_r2hsl(accent);
    PAL[13]=_hsl2hex(h-26, Math.max(0,s*0.85-0.04), Math.max(0.04,l-0.30));  // ombre : froide, désaturée, sombre
    PAL[14]=_hsl2hex(h,    Math.min(1,s+0.02),       Math.max(0.10,l-0.02));  // corps : mid (≈ accent)
    PAL[15]=_hsl2hex(h+20, Math.min(1,s+0.10),       Math.min(0.92,l+0.24));  // rim : chaude, saturée, claire
  }
  // MODE LIBRE : lu ici, AVANT setupCanvas qui s'en sert pour aligner l'art en
  // bas. Le renderer a nodeIntegration, donc pas de query string à faire suivre.
  const SOLO = (typeof process!=='undefined' && process.env.CAPSULE_SOLO==='1');
  if(SOLO) document.body.dataset.solo='1';
  const W=100, H=94;
  const scr=document.getElementById('scr');
  const g=scr.getContext('2d');
  const flr=Math.floor, sin=Math.sin, cos=Math.cos, abs=Math.abs, rnd=Math.round;
  // RENDU 4K : backing = pixels écran réels, art mis à l'échelle ENTIÈRE (pixels carrés nets)
  let DEV={w:W,h:H,s:1,ox:0,oy:0};
  function setupCanvas(){
    const dpr=window.devicePixelRatio||1;
    const cssW=scr.clientWidth||154, cssH=scr.clientHeight||144;
    const dw=Math.max(W,Math.round(cssW*dpr)), dh=Math.max(H,Math.round(cssH*dpr));
    scr.width=dw; scr.height=dh;
    const s=Math.max(1,Math.floor(Math.min(dw/W,dh/H)));        // facteur ENTIER → pas de pixels bavés
    // MODE LIBRE : l'art est collé en BAS, pas centré. Centré, la créature
    // flotte au milieu de la fenêtre — et comme c'est le bord bas de la fenêtre
    // qui touche le Dock, elle se retrouve suspendue au-dessus du vide. C'est le
    // contact avec le sol qui fait croire au poids ; sans lui, ça reste un
    // sticker posé sur l'écran.
    const oy = SOLO ? (dh - H*s) : Math.floor((dh-H*s)/2);
    DEV={w:dw,h:dh,s,ox:Math.floor((dw-W*s)/2),oy};
    g.setTransform(s,0,0,s,DEV.ox,DEV.oy);
    g.imageSmoothingEnabled=false;
  }
  let _dpr=0; setupCanvas();
  window.addEventListener('resize', setupCanvas);
  const r=(x,y,w,h,p)=>{ g.fillStyle=PAL[p]; g.fillRect(flr(x),flr(y),Math.max(1,flr(w)),Math.max(1,flr(h))); };
  const px=(x,y,p)=>{ g.fillStyle=PAL[p]; g.fillRect(flr(x),flr(y),1,1); };
  const cls=p=>{ g.save(); g.setTransform(1,0,0,1,0,0); g.clearRect(0,0,DEV.w,DEV.h);
    // En mode libre, l'effacement doit rendre le canvas VRAIMENT transparent.
    // Le voile 'rgba(18,16,15,0.5)' est le verre de l'écran CRT : sans plaque
    // derrière, il devient un rectangle gris posé sur le bureau — exactement
    // le cadre qu'on cherche à faire disparaître.
    if(!SOLO){ g.fillStyle='rgba(18,16,15,0.5)'; g.fillRect(0,0,DEV.w,DEV.h); }
    g.restore(); };
  // gerbe de particules (fin d'étape)
  let parts=[];
  function burst(cx,cy){ for(let i=0;i<14;i++){ const a=Math.random()*6.283, sp=18+Math.random()*36;
    parts.push({x:cx,y:cy,vx:cos(a)*sp,vy:sin(a)*sp-18,life:0.6+Math.random()*0.5,age:0}); } }
  function stepDrawParts(dt){ for(const p of parts){ p.vy+=95*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.age+=dt; }
    parts=parts.filter(p=>p.age<p.life);
    for(const p of parts){ const k=1-p.age/p.life, sz=k>0.5?2:1; r(p.x,p.y,sz,sz, k>0.6?3:2); } }

  // sprite de la créature (10 large) — antennes rapprochées, gros yeux, corps arrondi ; 2 frames de pattes
  // P3 — silhouette à VISAGE : petites oreilles pointues (ligne 0, cols 2&7), yeux conservés
  //      ligne 4 (accessoires inchangés), bouche 'M' ligne 5 → lit « créature », plus « Space Invader ».
  // V14 — SPRITE complet avec BRAS NATIFS marqués 'A' (directive de l'auteur « ça devrait être natif »
  //   → [[membres-avatar-natifs-pas-appendice]]). Les bras BRANCHENT aux épaules et FLANQUENT le corps
  //   (cols 1 & 8), courts (2 rangées) et remontés → lisent « bras », pas « jambes ». Même grille / pavage
  //   / rampe = fusion réelle. Balancement = décalage horizontal des cellules 'A' (pendule lent, accentué).
  // V28 — JAMBES SUPPRIMÉES (demande de l'auteur « supprime jambe ») : corps seul, bas arrondi, aucun membre.
  const BODY = [
    "  X    X  ",   // antennes
    " XXXXXXXX ",   // front
    "XXEXXXXEXX",   // yeux (cols 2 & 7)
    "XXXXXXXXXX",   // ventre
    " XXXXXXXX ",   // bas arrondi
  ];
  // ACCESSOIRE de rôle (couvre-chef / habit / objet, cohérent avec la fonction de l'agent).
  // Dessiné en coords FINES à partir de la géométrie de la tête (ox,oy = coin haut-gauche du
  // corps ; cw,chh = taille d'une « cellule » du corps, qui inclut déjà squash/stretch/pivot).
  //   Repères : centre tête X = ox+5·cw · sommet tête Y = oy · ligne des yeux Y = oy+4·chh
  //             œil gauche X = ox+2·cw · œil droit X = ox+7·cw
  function drawAcc(id, ox, oy, cw, chh){
    const HX=ox+5*cw, u=cw, eL=ox+2*cw, eR=ox+7*cw, eyeY=oy+2*chh;  // V21 : yeux ligne 2 (corps aminci) → lunettes/monocle alignés
    if(id==='flower'){                                   // JARDINIER — petite marguerite (croix de pétales + cœur + tige/feuille)
      const p=Math.max(1,flr(u*0.55)), cx=HX-flr(p*0.5), cy=oy-chh*0.55;
      r(cx+flr(p*0.1), cy+p*1.1, Math.max(1,flr(p*0.8)), chh*1.0, 8);     // tige verte
      r(cx+p, cy+p*1.9, p, Math.max(1,flr(p*0.7)), 8);                    // feuille
      r(cx-p, cy, p,p,9); r(cx+p, cy, p,p,9);                             // pétales gauche/droite
      r(cx, cy-p, p,p,9); r(cx, cy+p, p,p,9);                             // pétales haut/bas
      r(cx, cy, p,p,2); px(cx+flr(p*0.4), cy+flr(p*0.3), 3);              // cœur terracotta + point clair
    } else if(id==='chem'){                              // DISTILLATEUR — lunettes de sécurité (bandeau teinté large + sangle)
      const y=eyeY-chh*0.45, h=chh*1.7;
      const x0=eL-u*0.9, x1=eR+u*1.0, ww=x1-x0;
      r(ox+u*0.1, y+h*0.3, ww+u*1.6, chh*0.45, 5);       // sangle autour de la tête (derrière)
      r(x0, y, ww, h, 4);                                // monture sombre du masque
      r(x0+1, y+1, ww-2, h-2, 7);                        // verre teinté clair (une seule visière)
      r(x0+ww*0.5-0.5, y+1, 1, h-2, 4);                  // pont central entre les deux verres
      r(x0+ww*0.24, y+2, 2, 2, 9); r(x0+ww*0.72, y+2, 2, 2, 9); // reflets
    } else if(id==='hardhat'){                           // ARCHITECTE — casque blanc à visière large
      const ty=oy-chh*0.35;
      r(HX-u*1.9, ty+chh*0.5, u*3.8, chh*0.85, 9);       // base du dôme
      r(HX-u*1.3, ty, u*2.6, chh*0.7, 9);                // haut du dôme
      r(HX-u*1.3, ty, u*2.6, chh*0.28, 12);              // reflet
      r(HX-u*0.3, ty-chh*0.3, u*0.6, chh*0.5, 5);        // crête / aération
      r(HX-u*2.5, ty+chh*1.25, u*5.0, chh*0.45, 6);      // visière (dépasse des deux côtés)
      r(HX-u*2.5, ty+chh*1.65, u*5.0, chh*0.25, 4);      // ombre sous la visière
    } else if(id==='monocle'){                           // CHALLENGER — monocle sur l'œil droit + chaînette
      const w=u*2.1, h=chh*2.0, x=eR-u*0.8, y=eyeY-chh*0.7;
      r(x,y,w,h,4); r(x+1,y+1,w-2,h-2,7);                // monture + verre
      const cc=Math.max(1,flr(u*0.45));                   // coins « grignotés » → lentille ronde, pas carrée
      r(x,y,cc,cc,11); r(x+w-cc,y,cc,cc,11); r(x,y+h-cc,cc,cc,11); r(x+w-cc,y+h-cc,cc,cc,11);
      r(x+w*0.6,y+cc,Math.max(1,flr(u*0.4)),Math.max(1,flr(chh*0.4)),9); // reflet
      r(x+w*0.45, y+h, Math.max(1,flr(u*0.25)), chh*1.5, 4);            // chaînette qui pend
    } else if(id==='glasses'){                           // ARCHIVISTE — lunettes de lecture (deux verres + pont)
      const y=eyeY-chh*0.55, h=chh*1.5, w=u*1.9;
      const lx=eL-u*0.8, rx=eR-u*1.0;
      r(lx,y,w,h,4); r(lx+1,y+1,w-2,h-2,7);
      r(rx,y,w,h,4); r(rx+1,y+1,w-2,h-2,7);
      r(lx+w, y+h*0.45, rx-(lx+w), Math.max(1,chh*0.2), 4); // pont
      r(lx+w*0.6,y+2,2,2,9); r(rx+w*0.6,y+2,2,2,9);      // reflets
    } else if(id==='nodes'){                             // SYNTHÉTISEUR — constellation : 3 nœuds en TRIANGLE reliés, le sommet brille
      const y=oy-chh*0.55, s2=Math.max(2,flr(u*0.85));
      const P=[[ox+2.3*cw,y+chh*0.55],[HX,y-chh*0.4],[ox+7.7*cw,y+chh*0.55]];
      g.strokeStyle=PAL[11]; g.lineWidth=1;
      g.beginPath(); g.moveTo(P[0][0],P[0][1]); g.lineTo(P[1][0],P[1][1]); g.lineTo(P[2][0],P[2][1]); g.closePath(); g.stroke();
      P.forEach((p,i)=>{ r(p[0]-flr(s2/2), p[1]-flr(s2/2), s2, s2, 2); px(p[0],p[1], 9);   // nœud terracotta + cœur clair
        if(i===1){ px(p[0]-1,p[1]-1,3); px(p[0]+1,p[1]-1,3); } });                          // léger éclat sur le sommet
    } else if(id==='cap'){                               // MÉCANICIEN — casquette d'ouvrier (calotte bombée + visière avant)
      const ty=oy-chh*0.05;
      r(HX-u*1.5, ty+chh*0.5, u*3.0, chh*0.7, 2);        // base de la calotte (large)
      r(HX-u*1.1, ty+chh*0.15, u*2.4, chh*0.5, 2);       // palier intermédiaire → arrondi
      r(HX-u*0.7, ty-chh*0.2, u*1.6, chh*0.45, 2);       // sommet bombé
      r(HX-u*0.7, ty-chh*0.2, u*1.6, chh*0.18, 12);      // reflet sur le bombé
      r(HX-u*0.05, ty-chh*0.45, u*0.5, chh*0.3, 2);      // bouton au sommet
      r(HX-u*2.9, ty+chh*1.0, u*1.7, chh*0.4, 2);        // visière (avance vers la gauche, même teinte)
      r(HX-u*2.9, ty+chh*1.35, u*1.7, chh*0.16, 4);      // tranche d'ombre sous la visière
    }
  }
  // V4 — BOUCHE expressive selon l'humeur (4=trait sombre, 15=lèvre claire). Coords fines.
  // V5 — BOUCHE NEUTRE qui BOUGE (pas d'émotion : ni sourire ni moue). `open` 0..1 = ouverture animée par l'action.
  function drawMouth(mcx, my, u, ch, open){
    open=Math.max(0,Math.min(1,open||0));
    const w=Math.max(1,flr(u*1.8)), base=ch*0.16, h=Math.max(1,flr(base+open*ch*0.55));
    r(mcx-w/2, my-flr((h-base)*0.4), w, h, 4);                       // trait neutre centré qui s'épaissit en s'ouvrant
    if(open>0.45) r(mcx-w/2+1, my+flr(h*0.35), Math.max(1,w-2), 1, 15); // lèvre claire quand bien ouverte
  }
  // (V13 — drawArms()/drawLimb() supprimés : les bras sont désormais NATIFS dans la grille du sprite,
  //  cf. ARM_ROWS + le décalage de rangées dans critter(). Plus aucun calque de membre collé par-dessus.)
  // dessine la créature : (cx,cy)=centre, s=taille de pixel (chunky), opt.blink/look
  function critter(cx, cy, s, t, opt={}){
    if(_compose) return;                          // V19 : en compose, la scène ne dessine PAS la créature (dessinée centrée à part)
    const expr = opt.expr || _expr || 'happy';   // P2b : humeur (pilote la forme des yeux)
    const blink = opt.blink ?? ((t%3.2)<0.14);
    const rows = BODY; const w=10, h=rows.length; const armTop=rows.findIndex(rw=>rw.indexOf('A')>=0); // V17 : armTop dynamique
    // V12 — MOUVEMENT CALMÉ (demande de l'auteur : « pas de cadence frénétique du tout »). Respiration et
    //   rebond ralentis + amplitudes réduites → vivant mais posé. Avant : walk·5 = ~2.5 Hz (frénétique).
    const walk=t*(opt.fast?1.9:1.4);                            // cadence lente (alive, pas frénétique)
    let sy=1+sin(t*1.6)*0.08 + abs(sin(walk*Math.PI))*0.035;   // respiration douce (squash & stretch)
    let sx=1-sin(t*1.6)*0.08 - abs(sin(walk*Math.PI))*0.035;
    let hop=-abs(sin(walk*Math.PI))*(opt.fast?1.2:0.7);        // rebond discret (poids du pas)
    const left=celebrateUntil-Date.now();
    if(left>0){ const p=1-left/1500; hop+=-abs(sin(p*Math.PI*2))*9; sy*=1+sin(p*Math.PI*4)*0.12; sx*=1-sin(p*Math.PI*4)*0.12; }
    const press=opt.press||0;                                  // DÉFORMATION D'IMPACT : s'écrase en appuyant/manipulant
    sy*=1-0.22*press; sx*=1+0.22*press; hop+=press*2.4;        // squash vertical + élargissement + tassement vers le sol
    const reach=opt.reach, hand=opt.hand, ap=hand||reach;       // ap = point d'intérêt (regard + penché)
    // ORIENTATION : la créature PIVOTE vers ce qu'elle MANIPULE (mode hand uniquement → revient de face au repos)
    const faceT = hand ? Math.max(-1,Math.min(1,(hand.x-cx)/8)) : 0;
    faceCur += (faceT-faceCur)*0.15; const face=faceCur;
    const turnSq = 1-0.26*abs(face);                             // raccourci horizontal = perspective du 3/4
    const cyy=cy+hop, cw=s*sx*turnSq, chh=s*sy, cwI=Math.ceil(cw), chI=Math.ceil(chh);
    let lean=ap?Math.max(-1.5,Math.min(4,(ap.x-cx)*0.045)):0;    // se penche vers l'action
    let recoil=0; if(ap){ const edge=cx+w*s*0.5; recoil=-Math.min(8,Math.max(0,(edge+4)-ap.x)); } // RECULE si l'objet entre dans sa bulle
    const ox=cx-w*cw/2+lean+recoil+face*2.6, oy=cyy-h*chh/2;     // pivote + recule
    // ombre au sol : rétrécit quand il saute, suit le recul/pivot
    const gy=cy+h*s/2, swd=(w*s*0.62)*(1-(-hop)/16);
    r(cx-swd/2+recoil+face*2.6, gy, swd, Math.max(1,flr(s*0.35)), 4);
    // regard : suit le point d'action
    const lx=ap?Math.max(-1,Math.min(1,(ap.x-cx)/20)):(opt.look??0);
    const ly=ap?Math.max(-1,Math.min(1,(ap.y-cy)/20)):(opt.looky??0);
    // PAVAGE À BORDS EXACTS : la largeur d'une cellule = bord suivant − bord courant, donc les
    // cellules sont JOINTIVES sans se chevaucher. Fini l'effet « gaufre » (chevauchement d'1px
    // peint deux fois à 0.8 d'opacité → couture sombre qui quadrillait tout le corps).
    const xe = i => rnd(ox + i*cw), ye = j => rnd(oy + j*chh);
    g.globalAlpha=0.88+0.04*sin(t*2.2);                          // V11 : flicker holo calmé (avant t*7 = strobe cheap)
    const armSwing=sin(t*1.05)*cw*0.34;                          // pendule LENT (~0.17 Hz), ample
    const cellF=(jj,ii)=>{ const c=(jj>=0&&jj<h&&ii>=0&&ii<w)?rows[jj][ii]:' '; return c==='X'||c==='A'||c==='E'; }; // cellule « pleine » ?
    for(let j=0;j<h;j++){ for(let i=0;i<w;i++){ const ch=rows[j][i];
      const isArm = ch==='A';
      // V26 — membres : ancrés en haut (collés au ventre) + ÉVASEMENT vers l'extérieur (bas plus écarté) + balancement doux.
      const armDepth=j-armTop, splay=isArm?(i<5?-1:1)*1.4*armDepth:0;
      const wob=(j===0)?sin(t*2.4+i*1.6)*0.5:(isArm?splay+armSwing*armDepth:0);
      const X=xe(i)+wob, Y=ye(j), Wc=xe(i+1)-xe(i), Hc=ye(j+1)-ye(j);
      if(ch==='X'||isArm){ r(X,Y,Wc,Hc,14);                                  // V16 — corps ET bras = MÊMES cellules :
        if(!cellF(j-1,i)) r(X,Y,Wc,Math.max(1,flr(Hc*0.34)),15);            //   fill 14 + rim-haut, RIEN d'autre → fusion totale (matière identique)
      } else if(ch==='E'){
        const farEye=(face>0.35&&i<4)||(face<-0.35&&i>5); const isR=i>5;  // l'œil du côté opposé se ferme quand il tourne
        if(blink||farEye){ r(X,Y,Wc,Hc,14); r(X, Y+flr(Hc*0.5), Wc, Math.max(1,flr(Hc*0.3)), 4); } // œil fermé (trait)
        else { r(X,Y,Wc,Hc,4);                                              // orbite sombre
          const ex=Math.max(-1.4,Math.min(1.4,lx+face*1.3)), ey=Math.max(-1,Math.min(1,ly));
          // V4 — EXPRESSION poussée : paupières (peau 13) + reflet + SOURCIL (brow) pour le caractère
          let hw=Math.max(1,flr(Wc*0.42)), hh=Math.max(1,flr(Hc*0.42)), topLid=0, botLid=0, brow=0;
          if(expr==='wide'||expr==='sparkle'){ hw=Math.max(2,flr(Wc*0.66)); hh=Math.max(2,flr(Hc*0.66)); } // grand œil alerte/curieux
          else if(expr==='focus'){ topLid=flr(Hc*0.32); botLid=flr(Hc*0.26); hh=Math.max(1,flr(Hc*0.30)); brow=1; } // concentré + sourcils
          else if(expr==='sleepy'){ topLid=flr(Hc*0.66); hh=Math.max(1,flr(Hc*0.24)); }                  // paupières lourdes
          else if(expr==='skeptical'){ if(isR){ topLid=flr(Hc*0.58); botLid=flr(Hc*0.10); } else { brow=1; } } // droit plissé + gauche sourcil levé
          // V5 : plus d'yeux « contents » (happy/idle = neutre, œil plein)
          if(topLid) r(X,Y,Wc,topLid,13); if(botLid) r(X,Y+Hc-botLid,Wc,botLid,13);
          const slitY=Y+topLid+flr(Hc*0.14)+ey, maxY=Y+Hc-botLid-hh;
          r(X+flr(Wc*0.2)+ex, Math.min(slitY,Math.max(Y+topLid,maxY)), hw, hh, 9);                       // reflet vif
          if(expr==='sparkle') px(X+flr(Wc*0.74)+ex, Y+flr(Hc*0.10)+ey, 9);                              // double éclat
          if(brow) r(X+flr(Wc*0.08), Y-Math.max(1,flr(Hc*0.26)), Math.max(2,flr(Wc*0.84)), Math.max(1,flr(Hc*0.16)), 13); } // sourcil
      }
    }}
    // V8 — BOUCHE SUPPRIMÉE (demande de l'auteur) : visage = uniquement les yeux, comme la réf.
    //       drawMouth() est conservée (non appelée) au cas où on voudrait la réactiver.
    // P3 — bande holographique : fine ligne claire qui balaie le corps de bas en haut
    { const band=oy + (h*chh) - ((t*22)%(h*chh)); g.globalAlpha=0.10;
      r(ox+cw*0.5, band, (w-1)*cw, Math.max(1,flr(chh*0.45)), 15); }
    g.globalAlpha=1;
    // ACCESSOIRE de rôle (chapeau/habit) — stampé sur la grille du corps, donc il suit
    // le squash/stretch/pivot. Dessiné APRÈS le corps (passe par-dessus la tête).
    if(opt.acc) drawAcc(opt.acc, ox, oy, cw, chh);
    // (plus AUCUN bras dessiné — « lasso » supprimé. L'objet est tenu directement via opt.hand : couplage sans ligne.)
  }

  const SCENES = {};
  // ---- props au STYLE UNIFIÉ : contour sombre (4), corps gris (5), face claire (6),
  //      accent TERRACOTTA (2) réservé à l'élément actif. Personnage toujours à gauche. ----
  // ombre douce (rgba) — profondeur réelle au sol / contact entre objets
  function shadowRect(x,y,w,h,a){ g.fillStyle='rgba(0,0,0,'+a+')'; g.fillRect(flr(x),flr(y),Math.max(1,flr(w)),Math.max(1,flr(h))); }
  // BOÎTE/objet gris : volume (lumière haut-gauche) + grain de matière + ombre de contact
  function box(x,y,w,h){
    shadowRect(x+2,y+h,w,3,0.42);                                // P1 : ombre de contact + marquée → l'objet est posé, pas flottant
    r(x,y,w,h,4);                                                // arête sombre
    r(x+1,y+1,w-2,h-2,5);                                        // corps
    for(let j=3;j<h-1;j+=2) r(x+1,y+j,w-2,1,11);                 // grain horizontal (texture)
    r(x+1,y+1,w-2,1,12); r(x+1,y+1,1,h-2,12);                    // arêtes éclairées (haut + gauche)
    r(x+2,y+1,Math.max(1,w-4),1,6);                             // surbrillance du dessus
    r(x+1,y+h-2,w-2,1,10); r(x+w-2,y+1,1,h-2,10);               // occlusion (bas + droite) → relief
  }
  // PANNEAU papier/écran : face claire + fines lignes (texture) + ombre de contact
  function panel(x,y,w,h){
    shadowRect(x+2,y+h,w,3,0.36);                                // P1 : contact au sol + marqué
    r(x,y,w,h,4);                                                // cadre sombre
    r(x+1,y+1,w-2,h-2,6);                                        // face claire
    for(let j=2;j<h-1;j+=2) r(x+1,y+j,w-2,1,12);                 // lignes fines (papier/scanlines)
    r(x+1,y+1,w-2,1,9); r(x+1,y+1,1,h-2,9);                      // bords éclairés (haut + gauche)
    r(x+1,y+h-2,w-2,1,5);                                        // ombre basse
  }
  function surface(){}   // (retiré : la barre horizontale lisait comme une « corde » reliant créature et objets)
  // ÉCLAT spéculaire : tache de lumière vive → matière brillante (verre / métal poli)
  function spec(x,y){ r(x,y,2,1,9); r(x,y+1,1,1,7); px(x+2,y,12); }
  // LUEUR d'accent : bloom terracotta chaud diffusé par l'élément ACTIF (LED, essence, X…) — respiration douce
  function glow(x,y,rad){ const p=0.85+0.15*sin(Date.now()/260); rad=rad*2.0*p;   // P1 : bloom + large + cœur chaud → l'élément ACTIF attire l'œil
    let gr=g.createRadialGradient(x,y,0,x,y,rad);
    gr.addColorStop(0,'rgba(255,212,172,0.95)'); gr.addColorStop(0.22,'rgba(242,168,122,0.72)');
    gr.addColorStop(0.55,'rgba(205,120,80,0.32)'); gr.addColorStop(1,'rgba(199,123,90,0)');
    g.fillStyle=gr; g.fillRect(x-rad,y-rad,rad*2,rad*2); }
  // ENVIRONNEMENT de scène : profondeur sans aucune arête nette (lumière ambiante + vignette + sol en dégradé)
  function stage(){
    // MODE LIBRE : l'ambiance et le sol en dégradé sont le DÉCOR DE LA BOÎTE —
    // une lumière de coin et une pénombre montante n'ont de sens que dans un
    // caisson. Sur le bureau ils deviennent un rectangle grisâtre posé sur ce
    // que l'utilisateur regarde : exactement le cadre qu'on démonte.
    // La flaque, elle, RESTE : c'est la lumière au sol sous les pattes, et
    // c'est elle qui fait que la créature est posée et non collée.
    if(!SOLO){
      let amb=g.createLinearGradient(0,0,W,H);                  // lumière douce haut-gauche → coins sombres
      amb.addColorStop(0,'rgba(86,77,67,0.28)'); amb.addColorStop(0.5,'rgba(0,0,0,0)'); amb.addColorStop(1,'rgba(0,0,0,0.38)'); // P1 : coins moins noirs → props ne coulent plus
      g.fillStyle=amb; g.fillRect(0,0,W,H);
      let flo=g.createLinearGradient(0,H*0.5,0,H);              // sol : pénombre montante, bord flou (jamais une ligne)
      flo.addColorStop(0,'rgba(0,0,0,0)'); flo.addColorStop(1,'rgba(28,25,22,0.62)');
      g.fillStyle=flo; g.fillRect(0,H*0.5,W,H*0.5);
    }
    let pool=g.createRadialGradient(50,62,2,50,62,30);          // V19 : key-light recentré sous l'avatar (zone d'animation)
    pool.addColorStop(0,'rgba(168,150,128,0.50)'); pool.addColorStop(0.5,'rgba(150,132,112,0.20)'); pool.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=pool; g.fillRect(0,0,W,H);
  }

  // V22 — helpers d'ANIM FLUIDE : oscillation douce (ping-pong cosinus → 0→1→0, JAMAIS de teleport),
  //   sawtooth UNIQUEMENT masqué par un fade, et ease. Tue le « saccadé » des resets t%n en dents de scie.
  const osc=(tt,P)=>0.5-0.5*cos(tt/P*6.2832);
  const saw=(tt,P)=>(tt/P)%1;
  const easeIO=x=>x<.5?2*x*x:1-(2-2*x)*(2-2*x)/2;
  const fadeWrap=c=>Math.max(0,Math.min(1,Math.min(c*5,(1-c)*5)));  // fond→1→fond sur un cycle saw (cache le wrap)

  // REPOS : la créature respire, dandine des pattes, cligne, regard qui vagabonde
  SCENES.idle = (t)=>{ const bob=rnd(sin(t*2)*1.6);
    critter(50, 42+bob, 5, t, {look:rnd(sin(t*0.6)*1.2), looky:rnd(sin(t*0.9)*0.6)});   // V21 : avatar +1 (s=5)
    if((t%6)>5.3){ r(72,30-flr((t%6-5.3)/0.7*8),3,3,2);} };

  // DISTILLER : fixe un alambic ; l'essence (terracotta) goutte dans le bécher
  SCENES.distilling = (t)=>{
    box(56,44,14,14); r(58,50,10,6,5);
    for(let i=0;i<2;i++){ const bc=saw(t*1.7+i*0.5,1); g.globalAlpha=fadeWrap(bc); px(60+i*3,50-bc*7,6); g.globalAlpha=1; } // bulles (montent + fade)
    r(60,40,4,4,4); r(62,41,12,2,4); r(72,42,2,12,4);                  // col + tube
    box(70,52,12,8);                                                    // bécher
    const niv=58-flr(osc(t,5)*4);                                       // V23 : niveau d'essence en oscillation douce (plus de saut)
    glow(76,niv+2,9); r(72,niv,8,58-niv,2);                            // lueur + essence terracotta
    spec(73,niv+1); spec(78,53); spec(58,46);
    const dp=saw(t,1.3); g.globalAlpha=fadeWrap(dp); r(72,52+dp*6,2,2,2); g.globalAlpha=1; // goutte (tombe + fade, pas de teleport)
  };

  // ORGANISER (COUPLÉ) : la MAIN prend une fiche et la pose ; la pile grandit PARCE QUE la main pose.
  //   → un seul système : position de la fiche = position de la main. Pas de timeline séparée.
  // V22 — ORGANIZING refait, FLUIDE : pile rangée de fiches (tabs colorés) + une fiche qui descend en
  //   douceur et se pose ; boucle masquée par un fade (zéro teleport) ; pousse verte qui respire.
  SCENES.gardening = (t)=>{
    const x=58, baseY=62, cw2=20, tabs=[8,12,2];
    for(let i=0;i<3;i++){ panel(x, baseY-i*5, cw2, 5); r(x+2, baseY-i*5+1, 5,1, tabs[i]); } // pile rangée
    const topY=baseY-3*5;
    const c=saw(t,2.4), fy=30+easeIO(c)*(topY-7-30);                   // fiche qui descend (ease), boucle fadée
    g.globalAlpha=fadeWrap(c); panel(x, fy, cw2, 5); r(x+2, fy+1, 5,1, 2); g.globalAlpha=1;
    glow(x+cw2-4, topY-1, 4);                                          // lueur sur le sommet
    const gh=2+osc(t,3.5)*4; r(x+cw2-2, topY-gh, 1, gh, 8); r(x+cw2-3, topY-gh, 2,1, 8); // pousse qui respire
  };

  // SAUVEGARDER : pousse une disquette dans le lecteur (LED + barre terracotta)
  SCENES.committing = (t)=>{
    box(54,48,34,12); r(57,52,28,3,4); spec(56,49);                    // lecteur + fente + éclat
    if(osc(t,0.8)>0.5){ glow(85,51,6); r(84,50,2,2,2); }              // LED qui clignote (doux)
    r(54,62,34,4,4); r(55,63, flr(osc(t,3)*32),2, 2);                // V23 : barre de progression en oscillation
    const c=saw(t,2.6), k=easeIO(Math.min(1,c*1.4)), dx=78-flr(k*20); // disquette qui glisse dans la fente
    g.globalAlpha=fadeWrap(c); box(dx,44,15,12); r(dx+9,45,4,4,4); r(dx+2,50,11,4,6); g.globalAlpha=1;
  };

  // FILING : glisse une fiche (onglet terracotta) dans un classeur à tiroirs
  SCENES.filing = (t)=>{
    box(56,40,28,24);                                                  // meuble à tiroirs
    r(58,48,24,1,4); r(58,56,24,1,4); r(66,44,6,2,4); r(66,60,6,2,4);  // séparations + poignées fixes
    const c=saw(t,2.4), open=easeIO(osc(t,2.4))*5;                      // V23 : tiroir qui s'ouvre/ferme en douceur (osc)
    box(56-open,50,24,6); r(66,52,6,2,4); spec(58-open,51);            // tiroir + poignée + éclat

    r(mx-4,my-4,8,8,4); r(mx-3,my-3,6,6,6); spec(mx-1,my-2); r(mx+3,my+3,3,5,2); // loupe : verre + éclat + manche
  };
  // V22 — ARCHIVING refait, FLUIDE : pile de cartons GRIS (poids mort, froid) + un carton qui descend
  //   en douceur pour s'archiver ; boucle fadée (zéro teleport).
  SCENES.archiving = (t)=>{

      r(x,by,bw,7,4); r(x+1,by+1,bw-2,5,10); r(x+flr(bw/2)-1,by,2,7,5); r(x+1,by+1,bw-2,1,11); }
    const topY=baseY-3*7;

  // SYNTHESIZING : tisse un réseau — impulsion qui circule et ALLUME les nœuds (terracotta)
  SCENES.synthesizing = (t)=>{
    const N=[[58,34],[82,38],[60,56],[82,58],[70,46]];
    const E=[[4,0],[4,1],[4,2],[4,3],[0,1],[2,3]];

    for(const [a,b] of E){ g.beginPath(); g.moveTo(N[a][0]+.5,N[a][1]+.5); g.lineTo(N[b][0]+.5,N[b][1]+.5); g.stroke(); }
    const ei=flr(t*1.2)%E.length, e=E[ei], k=(t*1.2)%1, a=N[e[0]], b=N[e[1]];
    const ix=a[0]+(b[0]-a[0])*easeIO(k), iy=a[1]+(b[1]-a[1])*easeIO(k);

  // V22 — AUDITING refait, FLUIDE : 2 engrenages qui tournent en continu (lisse) + moyeu terracotta qui

    r(cx-15,cy-2+wob,9,3,4); r(cx-8,cy-3+wob,3,5,2); spec(cx-14,cy-1+wob); // clé : manche + tête terracotta
  };

  // ARCHITECTE : lit la topologie GLOBALE — sur un plan quadrillé, deux amas (domaines)
  //   que l'architecte RELIE par un pont terracotta en construction. Vue d'ensemble,
  //   distincte du 'mapping' (carte au trésor) du jardinier.
  SCENES.architecting = (t)=>{ panel(54,32,34,28);                    // plan / blueprint
    for(let i=1;i<5;i++){ r(54,32+i*6,34,1,12); r(54+i*7,32,1,28,12); } // grille fine
    const A=[[60,40],[64,45],[58,47]], B=[[80,50],[83,44],[78,55]];   // deux amas (domaines)
    g.strokeStyle=PAL[5]; g.lineWidth=1;                              // liens internes (gris)
    g.beginPath(); g.moveTo(A[0][0],A[0][1]); g.lineTo(A[1][0],A[1][1]); g.lineTo(A[2][0],A[2][1]);
    g.moveTo(B[0][0],B[0][1]); g.lineTo(B[1][0],B[1][1]); g.lineTo(B[2][0],B[2][1]); g.stroke();
    for(const n of A.concat(B)) r(n[0]-1,n[1]-1,2,2,5);               // nœuds gris
    const k=osc(t,3), ax=64,ay=45,bx=80,by=50;                       // V23 : PONT qui se construit/déconstruit en douceur (osc)
    for(let s=0;s<=k*9;s++){ const x=ax+(bx-ax)*s/9, y=ay+(by-ay)*s/9; r(x,y,1,1,2); }
    const hx=ax+(bx-ax)*k, hy=ay+(by-ay)*k;
    glow(hx,hy,5); r(hx-1,hy-1,3,3,2);                               // tête du pont (actif) + LUEUR
    if(k>0.9){ glow(bx,by,7); r(bx-2,by-2,4,4,2); }                  // l'amas cible s'ALLUME quand relié
    r(56,57,7,1,4); r(56,53,1,5,4); spec(56,53);                     // équerre d'architecte
  };

  // overlay "étape finie" : la créature saute + un ✓
  function drawCheck(w){
    const cx=78,cy=24,s=8+w*5; g.globalAlpha=Math.min(1,w*2);
    g.strokeStyle=PAL[2]; g.lineWidth=4; g.lineJoin='round'; g.beginPath();
    g.moveTo(cx-s*0.5,cy+s*0.05); g.lineTo(cx-s*0.1,cy+s*0.45); g.lineTo(cx+s*0.55,cy-s*0.5); g.stroke();
    g.globalAlpha=1;
  }

  // ── FOND CODE : le VRAI code du script de l'agent actif défile faiblement derrière la créature ──
  const CODE_SRC = { distilling:'agents/distillateur.md', gardening:'agents/jardinier.md', filing:'agents/jardinier.md',
    correcting:'agents/jardinier.md', mapping:'agents/jardinier.md', architecting:'agents/architecte.md',
    challenging:'agents/challenger.md', archiving:'agents/archiviste.md', synthesizing:'agents/synthetiseur.md',
    auditing:'hooks/brain_upkeep.py', committing:'hooks/auto_maintain.py' };
  let _codeCache={}, _codeLines=[];
  function loadCode(activity){                 // lit le VRAI fichier de l'agent (fs), met en cache
    const rel = CODE_SRC[activity];
    if(!rel){ _codeLines=[]; return; }
    if(_codeCache[rel]){ _codeLines=_codeCache[rel]; return; }
    try { const txt = fs.readFileSync(path.join(os.homedir(), '.c-brain', 'trunk',rel),'utf8');
      _codeLines = _codeCache[rel] = txt.split('\n').map(l=>l.replace(/\t/g,'  ')).filter(l=>l.trim().length>1).slice(0,500);
    } catch(e){ _codeLines=[]; }
  }
  function drawCodeBg(t, accent){              // défilement faible, en device-space, derrière la créature
    if(!_codeLines.length) return;
    g.save(); g.setTransform(1,0,0,1,0,0);
    const lh=Math.max(7,Math.floor(DEV.h/23)), fpx=lh-1;        // V23 : taille modérée
    g.font=fpx+'px "Courier New", monospace'; g.textBaseline='top'; g.fillStyle=accent;
    const n=Math.ceil(DEV.h/lh)+1, scroll=(t*8)%_codeLines.length, s0=Math.floor(scroll), subY=-(scroll-s0)*lh;
    for(let i=0;i<n;i++){ const y=i*lh+subY;
      // V23 — code DISCRET : atténué en haut/bas ET au CENTRE (derrière l'avatar) → hiérarchie avatar > anim > code
      const yc=y/DEV.h, edge=1-Math.abs(yc-0.5)*1.1, mid=0.55+0.45*Math.abs(yc-0.42)*2.2;
      g.globalAlpha=Math.max(0, 0.17*edge*Math.min(1,mid));
      g.fillText((_codeLines[(s0+i)%_codeLines.length]||'').slice(0,56), 4, y);
    }
    g.globalAlpha=1; g.restore();
  }
  // P3a — respect de prefers-reduced-motion (a11y) : moins de FPS, pas de particules ni de scintillement.
  const REDUCE = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let _lt=0, _lastDraw=0, _prevA=null, _transAt=0;
  // V22 — RÉVEIL À LA CADENCE VOULUE, pas à celle de l'écran.
  //   Avant : requestAnimationFrame était planifié en tête de render(), donc le renderer se réveillait
  //   au rafraîchissement du display (60/120 Hz) et sortait aussitôt par le cap fps. On payait 120 réveils
  //   par seconde pour dessiner 14 images — sur un MacBook Air sans ventilateur c'est du pur gaspillage,
  //   et chaque réveil force WindowServer à recomposer une fenêtre transparente alwaysOnTop.
  //   Maintenant : setTimeout(délai voulu) PUIS rAF → un seul réveil par image réellement dessinée.
  function fpsNow(){
    if(REDUCE) return 8;
    return cur.state==='busy' ? 30 : 6;   // V22 : busy 120→30 (pixel-art, l'œil ne voit pas la différence), repos 14→6
  }
  function schedule(){
    const wait = Math.max(0, 1000/fpsNow() - (Date.now() - _lastDraw));
    setTimeout(() => requestAnimationFrame(render), wait);
  }
  function render(){
    const now=Date.now();
    if(document.hidden){ schedule(); return; }                      // P3a — pause quand la fenêtre n'est pas visible
    _lastDraw=now;
    schedule();                                                     // planifie la suivante à la bonne cadence
    const t=(window.__forceT!=null?window.__forceT:now/1000), dt=Math.min(0.05,(now-_lt)/1000||0.016); _lt=now;  // __forceT : harness de vérif motion
    const dpr=window.devicePixelRatio||1; if(dpr!==_dpr){ _dpr=dpr; setupCanvas(); }  // suit le déplacement entre écrans
    cls(0);
    const a = cur.state==='busy' ? cur.activity : 'idle';
    if(a!==_prevA){ _transAt=now; _prevA=a; loadCode(a); }   // P3d : changement d'activité → recharge le code de fond
    stage();                                    // environnement (profondeur) sous la scène
    // Le code de fond est un RECTANGLE DE TEXTE derrière la créature : dans la
    // boîte c'est une profondeur, sur le bureau c'est un pavé qui recouvre ce
    // que l'utilisateur lit. Il ne sort pas en mode libre.
    if(cur.state==='busy' && !SOLO) drawCodeBg(t, ACCENT[a]||ACCENT.idle); // VRAI code de l'agent, faible, derrière la créature
    _expr = EXPR[a] || 'happy';                  // P2b : l'humeur suit l'agent actif
    // V19 — COMPOSITION VERTICALE (demande de l'auteur) : avatar CENTRÉ en haut · animation TOUJOURS en dessous.
    if(a==='idle'){
      SCENES.idle(t);                            // repos : la scène idle dessine déjà la créature centrée (x=50)
    } else if(SOLO){
      // MODE LIBRE — la créature garde sa place au SOL, quel que soit l'agent.
      //
      // MESURÉ : en busy, la composition de la boîte remonte la créature à y=26
      // et pose ses props dans la bande basse (y≈64). Sur le bureau, le résultat
      // est exactement ce qu'on voit — la créature décolle du Dock et ses objets
      // s'enfoncent dedans. La scène a été composée POUR un écran de 160×150 :
      // ses props sont placés en absolu dans le champ, ils ne savent pas se
      // ranger autour d'un personnage posé sur autre chose.
      //
      // Pour ce premier test, on garde ce que le personnage porte lui-même :
      // sa couleur d'agent, son humeur, et son accessoire de rôle. Ce qui
      // change, c'est LUI — pas un décor derrière lui. Les objets manipulés
      // reviendront quand ils seront dessinés sur la même ligne de sol.
      const bob=rnd(sin(t*2)*1.6);
      critter(50, 42+bob, 5, t, {look:rnd(sin(t*0.6)*1.2), looky:rnd(sin(t*0.9)*0.6), acc:ACC_OF[a]});
    } else {
      // la scène ne dessine que ses PROPS (créature supprimée via _compose) → on les recentre/réduit dans la
      //   bande basse, puis on dessine la créature centrée qui regarde son travail en dessous.
      _compose=true;
      g.save();
      g.translate(50,64); g.scale(0.88,0.88); g.translate(-70,-44);  // V21 : props agrandis (scale 0.76→0.88), centre (70,44) → (50,64)
      (SCENES[a] || SCENES.idle)(t);
      g.restore();
      _compose=false;
      critter(50, 26, 5, t, {looky:0.5, acc:ACC_OF[a]});  // V21 : avatar +1 (s=5), centré, AVEC son accessoire de rôle
    }

    const left = celebrateUntil - now;
    if(left>0){ const inT=1500-left; let w=inT<280?inT/280:(left<360?left/360:1); drawCheck(Math.max(0,Math.min(1,w))); }
    // P3d — TRANSITION : voile sombre qui se dissipe (240 ms) à chaque changement de scène → plus de coupure sèche.
    const tr=now-_transAt;
    if(!REDUCE && !SOLO && tr<240){ const k=(1-tr/240)*0.6; g.save(); g.setTransform(1,0,0,1,0,0);
